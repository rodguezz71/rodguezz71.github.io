<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temer - Escena y Reproductor</title>
    
    <!-- Dependencias de Iconos (Reproductor) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Variables del reproductor */
        :root {
            --pure-white: #ffffff;
            --white-glow: rgba(255, 255, 255, 0.6);
        }

        /* Estilos generales (Fondo 3D) */
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            background: black;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* --- ESTILOS DEL REPRODUCTOR FLOTANTE --- */
        .audio-controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex; 
            align-items: center; 
            gap: 15px;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 20px; 
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        .audio-controls i {
            cursor: pointer; 
            color: var(--pure-white); 
            font-size: 1.2rem; 
            text-shadow: 0 0 10px var(--white-glow);
            transition: 0.3s;
        }

        .audio-controls i:hover {
            text-shadow: 0 0 15px var(--pure-white);
            transform: scale(1.1);
        }

        input[type=range] { 
            -webkit-appearance: none; 
            width: 80px; 
            background: transparent; 
        }
        input[type=range]::-webkit-slider-runnable-track { 
            width: 100%; 
            height: 3px; 
            background: rgba(255, 255, 255, 0.3); 
            border-radius: 5px;
        }
        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            height: 12px; 
            width: 12px; 
            border-radius: 50%; 
            background: var(--pure-white); 
            cursor: pointer; 
            margin-top: -4.5px; 
            box-shadow: 0 0 10px var(--pure-white); 
        }

        /* --- ESTILOS DE LA ESCENA 3D Y TEXTOS --- */
        #textEffect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 70px;
            font-weight: 900;
            color: #ffffff;
            opacity: 0;
            letter-spacing: 6px;
            transition: opacity 1.2s;
            text-shadow: 0 0 10px #000000, 0 0 30px #000000, 0 0 60px #000000;
            pointer-events: none;
            z-index: 10;
            text-align: center;
            width: 90vw;
        }

        #imageContainer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 1.2s;
            pointer-events: none;
            z-index: 5;
            text-align: center;
        }

        #imageContainer img {
            max-width: 300px;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
        }

        .sub-text-top, .sub-text-bottom {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #aaaaaa; 
            opacity: 0;
            transition: opacity 1.2s;
            text-shadow: 0 0 10px #000000, 0 0 20px #000000;
            line-height: 1.4;
        }
        .sub-text-top { margin-bottom: 15px; }
        .sub-text-bottom { margin-top: 15px; }
         
        #smokeOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("https://static.vecteezy.com/system/resources/previews/010/884/548/original/dense-fluffy-puffs-of-white-smoke-and-fog-on-transparent-background-abstract-smoke-clouds-movement-blurred-out-of-focus-smoking-blows-from-machine-dry-ice-fly-fluttering-in-air-effect-texture-png.png") center/cover no-repeat;
            opacity: 0;
            transition: opacity 1.5s;
            pointer-events: none;
            z-index: 1; 
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <!-- REPRODUCTOR DE MÚSICA (Con Autoplay) -->
    <div class="audio-controls">
        <i class="fas fa-play" id="playBtn" onclick="togglePlay()"></i>
        <i class="fas fa-volume-up" id="muteBtn" onclick="toggleMute()"></i>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.5" oninput="changeVolume(this.value)">
    </div>
    
    <!-- Agregamos el atributo 'autoplay' aquí -->
    <audio id="bgMusic" loop autoplay>
        <source src="https://www.image2url.com/r2/default/audio/1784864943457-5ee0de5d-32e9-4ab5-ac15-277d4aab2315.mp3" type="audio/mpeg">
    </audio>

    <!-- ELEMENTOS DE LA ESCENA 3D -->
    <div id="smokeOverlay"></div>
    
    <div id="imageContainer">
        <img src="https://xatimg.com/image/yLXeAZnrGZKr.png" alt="Logo">
    </div>

    <div id="textEffect">
        <div id="topText" class="sub-text-top"></div>
        <div id="mainText"></div>
        <div id="bottomText" class="sub-text-bottom"></div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.147.0/three.min.js"></script>
    <script>
        // --- LÓGICA DEL REPRODUCTOR DE MÚSICA ---
        const music = document.getElementById('bgMusic');
        const muteBtn = document.getElementById('muteBtn');
        const playBtn = document.getElementById('playBtn');

        music.volume = 0.5;

        // Sincronizar el ícono de play/pause con el estado real del audio
        music.addEventListener('play', () => {
            playBtn.className = "fas fa-pause";
        });
        
        music.addEventListener('pause', () => {
            playBtn.className = "fas fa-play";
        });

        function togglePlay() {
            if (music.paused) {
                music.play();
            } else {
                music.pause();
            }
        }

        function toggleMute() {
            if (music.muted) { 
                music.muted = false; 
                muteBtn.className = "fas fa-volume-up"; 
            } else { 
                music.muted = true; 
                muteBtn.className = "fas fa-volume-mute"; 
            }
        }

        function changeVolume(val) {
            music.volume = val;
            muteBtn.className = val == 0 ? "fas fa-volume-mute" : "fas fa-volume-up";
            if(val > 0) music.muted = false;
        }

        // --- LÓGICA DE LA ESCENA 3D ---
        let scene, camera, renderer, flash, rain, rainGeo;
        let cloudParticles = [];
        let rainCount = 15000;
        let smokeParticles = [];

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);

            camera.position.z = 1;
            camera.rotation.x = 1.16;
            camera.rotation.y = -0.12;
            camera.rotation.z = 0.27;

            const ambient = new THREE.AmbientLight(0x555555);
            scene.add(ambient);

            const directionalLight = new THREE.DirectionalLight(0xffeedd);
            directionalLight.position.set(0, 0, 1);
            scene.add(directionalLight);

            flash = new THREE.PointLight(0x062d89, 30, 500, 1.7);
            flash.position.set(200, 300, 100);
            scene.add(flash);

            renderer = new THREE.WebGLRenderer();
            scene.fog = new THREE.FogExp2(0x11111f, 0.002);
            renderer.setClearColor(scene.fog.color);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            let positions = [];
            let sizes = [];
            rainGeo = new THREE.BufferGeometry();
            
            for (let i = 0; i < rainCount; i++) {
                positions.push(
                    Math.random() * 400 - 200,
                    Math.random() * 500 - 250,
                    Math.random() * 400 - 200
                );
                sizes.push(30);
            }
            
            rainGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(positions), 3));
            rainGeo.setAttribute("size", new THREE.BufferAttribute(new Float32Array(sizes), 1));

            const rainMaterial = new THREE.PointsMaterial({
                color: 0xaaaaaa,
                size: 0.1,
                transparent: true
            });

            rain = new THREE.Points(rainGeo, rainMaterial);
            scene.add(rain);

            let loader = new THREE.TextureLoader();
            loader.load(
                "https://static.vecteezy.com/system/resources/previews/010/884/548/original/dense-fluffy-puffs-of-white-smoke-and-fog-on-transparent-background-abstract-smoke-clouds-movement-blurred-out-of-focus-smoking-blows-from-machine-dry-ice-fly-fluttering-in-air-effect-texture-png.png",
                function (texture) {
                    const cloudGeo = new THREE.PlaneBufferGeometry(500, 500);
                    const cloudMaterial = new THREE.MeshLambertMaterial({
                        map: texture,
                        transparent: true
                    });

                    for (let p = 0; p < 25; p++) {
                        let cloud = new THREE.Mesh(cloudGeo, cloudMaterial);
                        cloud.position.set(
                            Math.random() * 800 - 400,
                            500,
                            Math.random() * 500 - 450
                        );

                        cloud.rotation.x = 1.16;
                        cloud.rotation.y = -0.12;
                        cloud.rotation.z = Math.random() * 360;
                        cloud.material.opacity = 0.6;
                        cloudParticles.push(cloud);
                        scene.add(cloud);
                    }
                    animate();
                    window.addEventListener("resize", onWindowResize);
                }
            );
        }

        function createSmokeBurst() {
            const geometry = new THREE.BufferGeometry();
            const count = 200;
            const positions = [];
            const velocities = [];
            
            for (let i = 0; i < count; i++) {
                positions.push(0, 0, 0);
                velocities.push(
                    (Math.random() - 0.5) * 2,
                    Math.random() * 2,
                    (Math.random() - 0.5) * 2
                );
            }
            
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.InputStream = true;
            geometry.setAttribute('velocity', new THREE.Float32BufferAttribute(velocities, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 3,
                transparent: true,
                opacity: 0.6,
                depthWrite: false
            });
            
            const points = new THREE.Points(geometry, material);
            points.position.set(0, 0, -20);
            scene.add(points);
            smokeParticles.push(points);
        }

        function updateSmoke() {
            smokeParticles.forEach(p => {
                let pos = p.geometry.attributes.position;
                let vel = p.geometry.attributes.velocity;
                for (let i = 0; i < pos.count; i++) {
                    pos.array[i * 3] += vel.array[i * 3] * 0.2;
                    pos.array[i * 3 + 1] += vel.array[i * 3 + 1] * 0.2;
                    pos.array[i * 3 + 2] += vel.array[i * 3 + 2] * 0.2;
                }
                pos.needsUpdate = true;
                p.material.opacity *= 0.995;
            });
        }

        function animate() {
            cloudParticles.forEach(p => {
                p.rotation.z -= 0.002;
            });
            
            rain.position.z -= 0.222;
            if (rain.position.z < -200) {
                rain.position.z = 0;
            }

            if (Math.random() > 0.93 || flash.power > 100) {
                if (flash.power < 100)
                    flash.position.set(Math.random() * 400, 300 + Math.random() * 200, 100);
                flash.power = 50 + Math.random() * 500;
            }
            
            updateSmoke();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();

        let textContainer = document.getElementById("textEffect");
        let mainText = document.getElementById("mainText");
        let topText = document.getElementById("topText");
        let bottomText = document.getElementById("bottomText");
        let imageContainer = document.getElementById("imageContainer");

        function showText(t) {
            mainText.innerHTML = t;
            textContainer.style.opacity = 1;
        }

        function hideText() {
            textContainer.style.opacity = 0;
            topText.style.opacity = 0;
            bottomText.style.opacity = 0;
        }

        function showImage() {
            imageContainer.style.opacity = 1;
        }

        function showExtraTextsWithDelay(topStr, bottomStr, delayMs) {
            topText.innerHTML = topStr;
            bottomText.innerHTML = bottomStr;
            
            setTimeout(() => {
                topText.style.opacity = 1;
                bottomText.style.opacity = 1;
            }, delayMs);
        }

        function hideExtraTexts() {
            topText.style.opacity = 0;
            bottomText.style.opacity = 0;
        }

        setTimeout(() => {
            createSmokeBurst();
        }, 2500);

        setTimeout(() => {
            showText("𒆜ᵀᵉᵐᵉʳ ̶̶̶ۣۜ͜͡ ✗☬™");
        }, 2000);

        setTimeout(() => {
            hideText();
        }, 5200);

        setTimeout(() => {
            showImage();
            createSmokeBurst();
        }, 6500);

        setTimeout(() => {
            showText("<br><br><br><br>");
            showExtraTextsWithDelay(
                "¿Qué haces cuando hay un mal que no puedes derrotar solo por tus medios?<br>¿Te manchas las manos con el mal para destruir el mal?<br>¿O permaneces firme y justo incluso si eso significa rendirte al mal?<br><br><i>*En mi caso, cometo el mal para destruir el mal mayor*</i>.",
                "Incluso si tengo que cargar con todos los males de este mundo...<br>no me importa. Si eso puede salvar al mundo, lo aceptaré con gusto.<br><br>Aquel que domina la oscuridad para derrotar al mal absoluto, no es un sirviente de la sombra, sino su maestro.",
                1000
            );
        }, 9000);

        setTimeout(() => {
            hideExtraTexts();
        }, 36000);

    </script>
</body>
</html>
