<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>XatSpace – Fake</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Sacramento&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  font-family:'Quicksand',sans-serif;
  background:radial-gradient(circle at top,#512b58,#3b1443,#250b2b);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* CONTENEDOR PRINCIPAL */
.wrapper{
  position:relative;
  display:flex;
  align-items:center;
}

/* BOTONES PEGADOS A LA CARD */
.menu-left{
  position:absolute;
  left:-110px;        
  top:36%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:12px;
  z-index:10;
}

.menu-left a{
  position:relative;
  width:115px;
  padding:10px 0;
  text-align:center;

  background:rgba(216, 112, 147, 0.65);
  backdrop-filter:blur(14px);

  border-radius:25px;
  border:1.5px solid rgba(255, 182, 193, 0.5);
  
  font-size:12px;
  font-weight:600;
  color:#fff0f5;
  text-decoration:none;

  box-shadow:
    inset 0 0 6px rgba(255, 192, 203, 0.6),
    0 4px 15px rgba(138, 43, 226, 0.3);

  transition:transform .25s ease,
             box-shadow .25s ease,
             border-color .25s ease,
             background .25s ease;

  font-family:'Quicksand',sans-serif;
  overflow:hidden;
}

.menu-left a::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    135deg,
    #ffb6c1,
    #da70d6,
    #ba55d3
  );
  opacity:0;
  transition:opacity .2s ease;
  z-index:-1;
}

.menu-left a:hover{
  transform:translateX(-8px) scale(1.05);
  background:rgba(218, 112, 214, 0.85);
  box-shadow:0 0 20px rgba(255, 182, 193, 0.8);
  border-color:#fff;
}

.menu-left a:hover::before{
  opacity:1;
}

/* TARJETA */
.card{
  position:relative;
  width:420px;
  height:560px;
  border-radius:35px;
  background:rgba(128, 0, 128, 0.75);
  backdrop-filter:blur(25px);
  box-shadow:0 20px 40px rgba(59, 20, 67, 0.6);
  z-index:2;
  overflow:hidden;
  border:2px solid rgba(255, 182, 193, 0.4);
}

/* BORDE INTERNO */
.card::before{
  content:"";
  position:absolute;
  inset:14px;
  border-radius:25px;
  border:1.5px dashed rgba(255, 192, 203, 0.7);
  pointer-events:none;
}

.avatar{
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  width:150px;
  height:150px;
  border-radius:50%;
  overflow:hidden;
  border:4px solid rgba(255, 182, 193, 0.9);
  box-shadow:0 0 25px rgba(218, 112, 214, 0.8);
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.name{
  position:absolute;
  top:215px;
  left:50%;
  transform:translateX(-50%);
  font-family:'Sacramento', cursive;
  font-size:42px;
  color:#ffd1dc;
  text-shadow:0 0 10px rgba(218, 112, 214, 0.8);
}

.subtitle{
  position:absolute;
  top:270px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  font-weight:600;
  letter-spacing:1px;
  color:#ffb6c1;
}

.bio{
  position:absolute;
  top:305px;
  left:50%;
  transform:translateX(-50%);
  width:82%;
  white-space: pre-wrap;
  padding:14px 16px;
  font-size:11px;
  font-weight:600;
  line-height:1.6;
  color:#fff0f5;
  text-align:center;
  background:rgba(218, 112, 214, 0.3);
  backdrop-filter:blur(10px);
  border-radius:20px;
  border:1px solid rgba(255, 182, 193, 0.3);
  box-shadow:0 4px 15px rgba(128, 0, 128, 0.2);
}

/* FIRMA */
.firma{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
}

.firma img{
  max-width:280px;
}

/* FOOTER */
.footer{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  font-size:9px;
  font-weight:600;
  color:#ffb6c1aa;
  letter-spacing:1px;
}

/* OVERLAY */
.modal-overlay{
  position:fixed;
  inset:0;
  background: rgba(81, 43, 88, 0.4);
  backdrop-filter: blur(10px);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.35s ease;
  z-index:999;
}

.modal-overlay.active{
  opacity:1;
  pointer-events:auto;
}

.modal-content{
  position:relative;
  width:90%;
  max-width:650px;
  height:530px;
  border-radius:30px;
  overflow:visible;
  box-shadow:0 0 50px rgba(218, 112, 214, 0.5);
  animation:zoomIn .35s ease;
}

.modal-content::before{
  content:"";
  position:absolute;
  inset:-4px;
  border-radius:34px;
  border:2.5px solid rgba(255, 182, 193, 0.9);
  pointer-events:none;
  box-shadow:
    0 0 25px rgba(218, 112, 214, 0.8),
    inset 0 0 20px rgba(255, 192, 203, 0.6);
}

.modal-content iframe{
  width:100%;
  height:100%;
  border:none;
  border-radius:30px;
  overflow:hidden;
}

/* BOTÓN CERRAR */
.modal-close{
  position:absolute;
  top:10px;
  right:15px;
  width:36px;
  height:36px;
  border-radius:50%;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(8px);
  color:#c71585;
  font-size:22px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  z-index:1000;
  box-shadow:0 6px 18px rgba(128,0,128,.4);
  transition:.25s ease;
}

.modal-close:hover{
  background:#ffb6c1;
  transform:scale(1.2) rotate(90deg);
  color:#fff;
}

@keyframes zoomIn{
  from{transform:scale(.85); opacity:0}
  to{transform:scale(1); opacity:1}
}

#heartsCanvas{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* PLAYER LATERAL */
.player-drop{
  position:fixed;
  left:calc(140% - 210px);
  top:42%;
  margin-top:120px;
  width:260px;
  transform: translateY(-15px);
  opacity:0;
  pointer-events:none;
  transition:.4s ease;
  z-index:1000;
}

.player-drop.active{
  transform: translateY(0);
  opacity:1;
  pointer-events:auto;
}

.player-glass{
  width:200px;
  padding:12px;
  background: rgba(128, 0, 128, 0.7);
  backdrop-filter: blur(18px);
  border-radius:22px;
  border:1.5px solid rgba(255, 182, 193, 0.4);
  margin-left:-1px;
  box-shadow:
    inset 0 0 15px rgba(255, 192, 203, 0.3),
    0 10px 30px rgba(59, 20, 67, 0.5);
}

.music-title{
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
  color:#ffb6c1;
  text-transform:uppercase;
  margin-bottom:6px;
  text-align:center;
}

.animated-song{
  font-size:11px;
  font-weight:600;
  margin-bottom:12px;
  background: linear-gradient(90deg,#fff,#ffb6c1,#fff);
  background-size:200% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation: songGlow 4s linear infinite;
  text-align: center;
}

@keyframes songGlow{
  to{ background-position:200% center; }
}

.player-controls{
  display:flex;
  justify-content:center;
  gap:12px;
}

.player-controls button{
  width:35px;
  height:35px;
  border-radius:50%;
  background: rgba(255, 182, 193, 0.25);
  border:1px solid rgba(255, 255, 255, 0.4);
  cursor:pointer;
  backdrop-filter: blur(12px);
  transition:.3s;
  color:#fff;
  font-size: 12px;
}

.player-controls button:hover{
  transform: scale(1.15);
  background: rgba(255, 182, 193, 0.5);
  box-shadow:0 0 15px rgba(255, 182, 193, 0.8);
}

.progress{
  margin-top:12px;
  width:100%;
  accent-color:#ffb6c1;
}

.menu-left .btn-player{
  width:115px;
  display:block;
}

.menu-left .btn-player > a{
  width:100%;
  display:block;
}

img{
  pointer-events:none;
  user-select:none;
}

/* AVATAR WRAP & ICONS */
.avatar-wrap{
  position:absolute;
  top:40px;
  left:50%;
  transform:translateX(-50%);
  width:150px;
  height:150px;
}

.home-icon{
  position:absolute;
  width:24px;
  height:24px;
  border-radius:50%;
  top:135px;
  left:15px;
  z-index:15;
  cursor:pointer;
  transition:.25s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  background: rgba(255, 182, 193, 0.8);
  border: 1.5px solid #fff;
  box-shadow: 0 0 10px rgba(218, 112, 214, 0.8);
}

.home-icon img{
  width:16px;
  height:16px;
  pointer-events:none;
}

.home-icon:hover{
  transform:scale(1.25);
}

/* INTRO */
.intro{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  background: radial-gradient(
    circle at top,
    #3b1443,
    #250b2b,
    #18051d
  );
  overflow:hidden;
}

.heart-wrapper{
  transform: translateY(-10px);
}

.heart-enter{
  position:relative;
  width:130px;
  height:130px;
  cursor:pointer;
  transform:rotate(-45deg);
  animation:heartFloat 3s ease-in-out infinite;
  filter:
    drop-shadow(0 0 20px rgba(218, 112, 214, 0.8))
    drop-shadow(0 0 45px rgba(255, 182, 193, 0.5));
  transition:.35s ease;
}

.heart-enter::before,
.heart-enter::after{
  content:"";
  position:absolute;
  width:130px;
  height:130px;
  border-radius:50%;
  z-index:1;
  background:linear-gradient(
    145deg,
    #ffb6c1,
    #da70d6,
    #ba55d3
  );
}

.heart-enter::before{ top:-65px; left:0; }
.heart-enter::after{ left:65px; top:0; }

.heart-glass{
  position:absolute;
  inset:0;
  border-radius:20px;
  z-index:2;
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.4),
    rgba(255,182,193,.8)
  );
  backdrop-filter:blur(12px);
  box-shadow:
    inset 0 0 25px rgba(255,255,255,.6),
    0 0 35px rgba(218, 112, 214, 0.7);
}

.heart-glass::after{
  content:"";
  position:absolute;
  inset:16px;
  border-radius:15px;
  border:1.5px dashed rgba(255,255,255,.9);
}

.heart-text{
  position:absolute;
  inset:0;
  z-index:10;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transform:rotate(45deg);
  font-family:'Sacramento',cursive;
  font-size:34px;
  color:#fff;
  text-shadow:0 2px 5px rgba(128,0,128,0.8);
  pointer-events:none;
}

.mini-heart{
  position:absolute;
  width:14px;
  height:14px;
  z-index:3;
  background:linear-gradient(145deg,#fff,#ffb6c1);
  transform:rotate(-45deg);
  opacity:.85;
  animation:floatMini 3s ease-in-out infinite;
}

.mini-heart::before,
.mini-heart::after{
  content:"";
  position:absolute;
  width:14px;
  height:14px;
  background:inherit;
  border-radius:50%;
}

.mini-heart::before{ top:-7px; left:0; }
.mini-heart::after{ left:7px; top:0; }

.mh1{ left:-26px; top:22px; animation-delay:.2s; }
.mh2{ right:-26px; top:38px; animation-delay:.4s; }
.mh3{ left:18px; bottom:-28px; animation-delay:.6s; }
.mh4{ right:20px; bottom:-32px; animation-delay:.8s; }

.heart-enter:hover{
  transform:rotate(-45deg) scale(1.12);
}

@keyframes heartFloat{
  0%,100%{ transform:rotate(-45deg) translateY(0); }
  50%{ transform:rotate(-45deg) translateY(-10px); }
}

@keyframes floatMini{
  0%,100%{ transform:rotate(-45deg) translateY(0); opacity:.7; }
  50%{ transform:rotate(-45deg) translateY(-8px); opacity:1; }
}

#page-transition{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center,
    rgba(218, 112, 214, 0.85),
    rgba(81, 43, 88, 0.95)
  );
  opacity:0;
  pointer-events:none;
  z-index:9999;
  transform:scale(1.2);
  filter:blur(20px);
  transition: opacity .9s ease, transform .9s ease, filter .9s ease;
}

body.is-transitioning #page-transition{
  opacity:1;
  transform:scale(1);
  filter:blur(0);
}

.page-content{
  min-height:100vh;
  width:100%;
  display:flex;
  justify-content:center;
  opacity:0;
  transform:translateY(20px);
  transition: opacity 1.4s ease, transform 1.4s ease;
}

body.entered .page-content{
  opacity:1;
  transform:translateY(0);
}

body.entered{
  overflow:auto;
}

.heart-sparkle{
  position: fixed;
  width: 8px;
  height: 8px;
  background: radial-gradient(circle, #ffb6c1, transparent);
  border-radius: 50%;
  pointer-events:none;
  z-index: 99998;
  animation: sparkleFade .6s ease-out forwards;
}

@keyframes sparkleFade{
  from{ opacity:1; transform: scale(1); }
  to{ opacity:0; transform: scale(2.5); }
}

html, body{
  pointer-events: auto !important;
}

.corazon-xat {
    position: fixed;
    font-size: 16px;
    color: #ffb6c1;
    animation: corazonFlotar 3.5s ease-out forwards;
    pointer-events: none;
    z-index: 999999;
    text-shadow: 0 0 8px rgba(218, 112, 214, 0.8);
}

@keyframes corazonFlotar {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-120px) scale(1.4); opacity: 0; }
}

html, body, a, div, span, p, img, button, input, textarea, select, * {
    cursor: none !important;
}

/* MARRIED INTEGRADO */
.married-card{
  width:380px;
  height:520px;
  background:rgba(128, 0, 128, 0.8);
  backdrop-filter:blur(22px);
  border-radius:30px;
  position:relative;
  box-shadow:0 18px 35px rgba(59, 20, 67, 0.6);
  overflow:hidden;
  margin:auto;
  border:2px solid rgba(255, 182, 193, 0.4);
}

.married-card::before{
  content:"";
  position:absolute;
  inset:14px;
  border-radius:22px;
  border:1.5px dashed rgba(255, 192, 203, 0.7);
}

.married-card .avatar-wrap{
  position:absolute;
  top:30px;
  left:50%;
  transform:translateX(-50%);
  width:150px;
  height:150px;
}

.married-card .avatar{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  border:4px solid rgba(255, 182, 193, 0.9);
  box-shadow:0 0 25px rgba(218, 112, 214, 0.8);
}

.married-card .avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.married-heart{
  position:absolute;
  right:-2px;
  bottom:5px;
  width:36px;
  height:36px;
  border-radius:50%;
  background:linear-gradient(145deg,#ffb6c1,#da70d6);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 15px rgba(255, 182, 193, 0.9);
  border:2px solid #fff;
}

.married-heart span{
  font-size:16px;
  color:#fff;
}

.married-card .name{
  position:absolute;
  top:195px;
  left:50%;
  transform:translateX(-50%);
  font-family:'Sacramento',cursive;
  font-size:38px;
  color:#ffd1dc;
}

.married-card .id{
  position:absolute;
  top:245px;
  left:50%;
  transform:translateX(-50%);
  font-size:11px;
  font-weight:600;
  color:#ffb6c1;
}

.married-card .message{
  position:absolute;
  top:280px;
  left:50%;
  transform:translateX(-50%);
  width:82%;
  padding:14px;
  text-align:center;
  font-size:13px;
  font-weight:600;
  line-height:1.6;
  color:#fff0f5;
  background:rgba(218, 112, 214, 0.35);
  backdrop-filter:blur(12px);
  border-radius:20px;
  border:1px solid rgba(255,182,193,.3);
}

.married-card .xatme{
  position:absolute;
  bottom:45px;
  left:50%;
  transform:translateX(-50%);
}

.married-card .xatme a{
  padding:8px 25px;
  border-radius:20px;
  background:linear-gradient(145deg,#ffb6c1,#da70d6);
  border:1px solid rgba(255,255,255,.8);
  font-size:11px;
  font-weight:700;
  color:#fff;
  text-decoration:none;
  box-shadow:0 0 15px rgba(218, 112, 214, 0.8);
  transition:.25s ease;
  display:inline-block;
}

.married-card .xatme a:hover{
  transform:scale(1.15);
  box-shadow:0 0 25px rgba(255, 182, 193, 1);
}

/* FRIENDS INTEGRADO */
.friends-card{
  width:420px;
  height:520px;
  border-radius:30px;
  background:rgba(128, 0, 128, 0.8);
  backdrop-filter:blur(20px);
  box-shadow:0 15px 25px rgba(59, 20, 67, 0.6);
  position:relative;
  overflow:hidden;
  margin:auto;
  border:2px solid rgba(255, 182, 193, 0.4);
}

.friends-card::before{
  content:"";
  position:absolute;
  inset:14px;
  border-radius:22px;
  border:1.5px dashed rgba(255, 192, 203, 0.7);
}

.friends-title{
  text-align:center;
  margin-top:24px;
  font-family:'Sacramento',cursive;
  font-size:38px;
  color:#ffd1dc;
  letter-spacing:2px;
}

.friends-list{
  margin:15px auto 0;
  width:82%;
  max-height:360px;
  overflow-y:auto;
  padding-right:6px;
}

.friend-item{
  background:rgba(218, 112, 214, 0.35);
  backdrop-filter:blur(12px);
  border-radius:18px;
  padding:10px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  box-shadow:0 4px 10px rgba(59, 20, 67, 0.2);
  border:1px solid rgba(255,182,193,.25);
}

.friend-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.friends-card .avatar{
  width:34px;
  height:34px;
  left:0;
  top:0;
  border-radius:50%;
  background:linear-gradient(145deg,#ffb6c1,#da70d6);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:11px;
  color:#fff;
  box-shadow:0 0 10px rgba(218,112,214,0.6);
}

.friend-name{
  font-size:13px;
  font-weight:600;
  color:#fff0f5;
}

.friend-id{
  font-size:10px;
  font-weight:600;
  color:#ffb6c1;
}

.friend-btn{
  padding:5px 12px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.6);
  background:linear-gradient(145deg,#ffb6c1,#da70d6);
  font-size:10px;
  font-weight:700;
  color:#fff;
  text-decoration:none;
  transition:.25s ease;
}

.friend-btn:hover{
  transform:scale(1.1);
  box-shadow:0 0 15px rgba(255, 182, 193, 0.9);
}
</style>
</head>

<body>

<!-- INTRO -->
<div class="intro" id="intro">
  <div class="heart-wrapper">
    <div class="heart-enter" onclick="enterSite()">
      <div class="heart-glass"></div>
      <span class="heart-text">Entrar</span>
      <i class="mini-heart mh1"></i>
      <i class="mini-heart mh2"></i>
      <i class="mini-heart mh3"></i>
      <i class="mini-heart mh4"></i>
    </div>
  </div>
</div>

<div id="page-transition"></div>

<!-- CONTENIDO PRINCIPAL -->
<div class="page-content">

  <canvas id="heartsCanvas"></canvas>

  <div class="wrapper">

    <!-- BOTONES -->
    <div class="menu-left">
      <a href="#" onclick="abrirMarried(); return false;">♡ Married ♡</a>
      <a href="#" onclick="abrirFriend(); return false;">♡ Friend ♡</a>

      <div class="btn-player">
        <a href="#" onclick="togglePlayer(); return false;">♡ Musica ♡</a>

        <div class="player-drop" id="playerDrop">
          <div class="player-glass">
            <div class="music-title">Musica</div>
            <div class="song-name animated-song" id="songName">Cargando...</div>

            <div class="player-controls">
              <button id="prevBtn">⏮</button>
              <button id="playPauseBtn">▶</button>
              <button id="nextBtn">⏭</button>
            </div>

            <input type="range" id="progress" class="progress" value="0">
          </div>
        </div>
      </div>
    </div>

    <!-- CARD -->
    <div class="card">
      <div class="avatar-wrap">
        <div class="avatar">
          <img src="https://xatimg.com/image/TwBgdTt2WAkd.gif">

<script>
document.addEventListener("DOMContentLoaded", () => {
  const element = document.getElementById("typingText");
  if (!element) return;

  if (element.dataset.typed === "true") return;
  element.dataset.typed = "true";

  const text = element.textContent.trim();
  element.textContent = "";

  let index = 0;
  const speed = 65;

  function typeEffect() {
    if (index < text.length) {
      element.textContent += text.charAt(index);
      index++;
      setTimeout(typeEffect, speed);
    }
  }

  typeEffect();
});

const canvas = document.getElementById("heartsCanvas");
const ctx = canvas.getContext("2d");

let w, h;
function resize(){
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

const hearts = [];
const HEART_COUNT = 40;

function createHeart(startTop = true){
  return {
    x: Math.random() * w,
    y: startTop ? -30 : Math.random() * h,
    size: 5 + Math.random() * 5,
    speed: 0.2 + Math.random() * 0.5,
    drift: (Math.random() - 0.5) * 0.2,
    alpha: 0.15 + Math.random() * 0.3
  };
}

for(let i = 0; i < HEART_COUNT; i++){
  hearts.push(createHeart(false));
}

function drawHeart(x, y, size, alpha, scaleX = 1.1, scaleY = 0.75){
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size * scaleX, size * scaleY);

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(-0.5, -0.6, -1.4, 0.3, 0, 1.6);
  ctx.bezierCurveTo(1.4, 0.3, 0.5, -0.6, 0, 0);
  ctx.closePath();

  ctx.fillStyle = `rgba(255, 182, 193, ${alpha})`;
  ctx.fill();
  ctx.restore();
}

function animate(){
  ctx.clearRect(0, 0, w, h);

  hearts.forEach((heart, i) => {
    heart.y += heart.speed;
    heart.x += heart.drift;

    drawHeart(heart.x, heart.y, heart.size, heart.alpha);

    if(heart.y > h + 40){
      hearts[i] = createHeart(true);
    }
  });

  requestAnimationFrame(animate);
}

animate();

let songs = [
  { name: "Suvivor - Beyonce", url: "https://www.image2url.com/r2/default/audio/1785315962821-7c1b497a-48c5-479d-b4cc-f211de1cbf4d.mp3" },

];

let audio = new Audio();
let currentIndex = 0;
let isPlaying = false;

const playPauseBtn = document.getElementById("playPauseBtn");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");
const songName = document.getElementById("songName");
const progress = document.getElementById("progress");

function loadSong(autoplay = false){
  audio.src = songs[currentIndex].url;
  songName.textContent = songs[currentIndex].name;

  if(autoplay){
    audio.play().then(()=>{
      isPlaying = true;
      playPauseBtn.textContent = "⏸";
    }).catch(()=>{});
  }
}

playPauseBtn.addEventListener("click", () => {
  if(audio.paused){
    audio.play();
    isPlaying = true;
    playPauseBtn.textContent = "⏸";
  }else{
    audio.pause();
    isPlaying = false;
    playPauseBtn.textContent = "▶";
  }
});

nextBtn.onclick = () => {
  currentIndex = (currentIndex + 1) % songs.length;
  loadSong(true);
};

prevBtn.onclick = () => {
  currentIndex = (currentIndex - 1 + songs.length) % songs.length;
  loadSong(true);
};

audio.addEventListener("ended", () => {
  currentIndex = (currentIndex + 1) % songs.length;
  loadSong(true);
});

progress.addEventListener("input", () => {
  if(audio.duration){
    audio.currentTime = (progress.value / 100) * audio.duration;
  }
});

loadSong(false);

function togglePlayer(){
  document.getElementById("playerDrop").classList.toggle("active");
}

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
document.addEventListener('dragstart', e => e.preventDefault());

function enterSite(){
  const intro = document.getElementById("intro");
  if(!intro) return;

  intro.style.pointerEvents = "none";
  document.body.classList.add("entered");

  audio.play().then(()=>{
    isPlaying = true;
    playPauseBtn.textContent = "⏸";
  }).catch(()=>{});

  intro.style.transition = "opacity 1s ease";
  intro.style.opacity = "0";

  setTimeout(() => {
    intro.remove();
  }, 1100);
}

function spawnSparkle(e){
  const sparkle = document.createElement("div");
  sparkle.className = "heart-sparkle";
  sparkle.style.left = e.clientX + "px";
  sparkle.style.top = e.clientY + "px";
  document.body.appendChild(sparkle);

  setTimeout(() => sparkle.remove(), 600);
}

document.addEventListener('mousemove', spawnSparkle);

document.addEventListener("mousemove", function(e) {
    let corazon = document.createElement("div");
    corazon.className = "corazon-xat";
    corazon.innerHTML = "❤";
    corazon.style.left = (e.clientX + 5) + "px";
    corazon.style.top = (e.clientY + 5) + "px";

    document.body.appendChild(corazon);

    setTimeout(() => {
        corazon.remove();
    }, 3500);
});

function abrirFriend(){
  document.getElementById("friendModal").classList.add("active");
}

function cerrarFriend(){
  document.getElementById("friendModal").classList.remove("active");
}

function abrirMarried(){

}
