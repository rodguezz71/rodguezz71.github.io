<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CutePink Premium</title>
    <LINK REL="SHORTCUT ICON" href="https://i.pinimg.com/474x/48/86/df/4886df18dada05a0337454a424358e9e.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --accent: #ff85a2;
            --glow: #f72585;
            --bg-glass: rgba(15, 0, 25, 0.85);
            --pure-white: #ffffff;
            --white-glow: rgba(255, 255, 255, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; width: 100vw;
            background: radial-gradient(circle at center, #1a0033 0%, #000000 100%);
            font-family: 'Quicksand', sans-serif;
            color: white; overflow: hidden; padding: 15px;
            position: relative;
        }

        /* --- FONDO GLITTER / BRILLOS DINÁMICOS --- */
        .glitter-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .glitter {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff85a2, 0 0 20px #f72585;
            animation: glitterAnim var(--duration) ease-in-out infinite, moveGlitter var(--moveDuration) linear infinite;
        }

        @keyframes glitterAnim {
            0%, 100% { opacity: 0.1; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.4); }
        }

        @keyframes moveGlitter {
            0% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-20px) translateX(10px); }
            100% { transform: translateY(0) translateX(0); }
        }

        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.4; animation: twinkle var(--duration) infinite; z-index: 1; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .neon-border-box {
            position: relative;
            width: 100%;
            max-width: 580px;
            padding: 3px;
            border-radius: 32px;
            overflow: hidden;
            z-index: 10;
        }

        .neon-border-box::before {
            content: '';
            position: absolute;
            width: 150%; height: 150%;
            top: -25%; left: -25%;
            background: conic-gradient(transparent, transparent, transparent, var(--accent), var(--glow));
            animation: rotateBorder 4s linear infinite;
        }

        @keyframes rotateBorder { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .player-glass {
            background: var(--bg-glass);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            width: 100%;
            display: flex;
            padding: 25px;
            gap: 20px;
            position: relative;
            z-index: 11;
        }

        .left-side {
            width: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid rgba(255, 133, 162, 0.2);
            padding-right: 20px;
            position: relative;
            flex-shrink: 0;
        }

        .couple-gif {
            width: 130px; height: 130px;
            background: url('https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUyb3pjemJjajVsbjBmOWd5MmZwbTFnZ3ZiY2pkMjFqdXI3YzB1YTNuMyZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/z3A8QI3qRMs9l0suj4/giphy.gif') no-repeat center;
            background-size: contain;
            filter: drop-shadow(0 0 10px var(--glow));
            margin-bottom: 15px; z-index: 5;
        }

        .back-heart {
            position: absolute; color: var(--accent); pointer-events: none;
            z-index: 2; font-size: 18px; top: 40%; left: 45%;
            animation: floatUp 2.5s ease-out forwards; opacity: 0;
            text-shadow: 0 0 5px var(--glow);
        }
        @keyframes floatUp { 0% { transform: translate(0, 0) scale(0.5); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(var(--x), -120px) scale(1.5); opacity: 0; } }

        .time-box {
            text-align: center; background: rgba(0, 0, 0, 0.4);
            padding: 8px 10px; border-radius: 12px;
            border: 1px solid rgba(255, 133, 162, 0.1);
            width: 100%;
        }
        #current-date { font-size: 0.6rem; color: var(--accent); font-weight: 700; text-transform: uppercase; }
        #current-time { font-size: 1rem; font-weight: 700; color: white; display: block; }

        .right-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        h1 { 
            font-family: 'Dancing Script', cursive; 
            font-size: 2.1rem;
            color: var(--accent); 
            text-shadow: 0 0 10px rgba(247, 37, 133, 0.5); 
            margin-bottom: 12px;
            white-space: nowrap;
        }

        .music-info {
            display: flex; align-items: center; gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px; border-radius: 18px; margin-bottom: 15px;
            width: 100%;
            overflow: hidden;
        }

        .vinilo {
            width: 65px; height: 65px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            overflow: hidden; flex-shrink: 0;
            background: #111;
        }
        .vinilo img { width: 100%; height: 100%; object-fit: cover; animation: rotateDisk 12s linear infinite; animation-play-state: paused; }
        .playing .vinilo img { animation-play-state: running; }
        @keyframes rotateDisk { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .text-data { 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            flex: 1;
        }
        
        #track-title { 
            font-weight: 700; font-size: 0.9rem; color: #fff; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
            width: 100%;
        }
        #artist-name { 
            font-size: 0.75rem; color: var(--accent); opacity: 0.8; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis;
        }

        .audio-controls {
            display: flex; 
            align-items: center; 
            gap: 15px;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 20px; 
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
            width: 100%;
        }

        .audio-controls i {
            cursor: pointer; 
            color: var(--pure-white); 
            font-size: 1.2rem; 
            text-shadow: 0 0 10px var(--white-glow);
            transition: 0.3s;
        }

        .audio-controls i:hover {
            text-shadow: 0 0 15px var(--pure-white);
            transform: scale(1.1);
        }

        input[type=range] { 
            -webkit-appearance: none; 
            flex: 1; 
            background: transparent; 
        }
        input[type=range]::-webkit-slider-runnable-track { 
            width: 100%; 
            height: 3px; 
            background: rgba(255, 255, 255, 0.3); 
            border-radius: 5px;
        }
        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            height: 12px; 
            width: 12px; 
            border-radius: 50%; 
            background: var(--pure-white); 
            cursor: pointer; 
            margin-top: -4.5px; 
            box-shadow: 0 0 10px var(--pure-white); 
        }

        .listeners { font-size: 0.6rem; margin-top: 12px; opacity: 0.7; display: flex; justify-content: space-between; align-items: center; }

        .firma-creador {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            z-index: 50; 
            pointer-events: none; 
            animation: colorFirma 4s infinite alternate ease-in-out;
        }

        @keyframes colorFirma {
            0% { color: #555555; opacity: 0.3; text-shadow: 0 0 2px rgba(85,85,85,0.2); } 
            50% { color: #e0e0e0; opacity: 0.7; text-shadow: 0 0 8px rgba(224,224,224,0.6); } 
            100% { color: #999999; opacity: 0.4; text-shadow: 0 0 4px rgba(153,153,153,0.3); } 
        }

        @media (max-width: 550px) {
            .player-glass { flex-direction: column; align-items: center; padding: 20px; }
            .left-side { border-right: none; border-bottom: 1px solid rgba(255, 133, 162, 0.2); padding-right: 0; padding-bottom: 15px; width: 100%; }
            .right-side { width: 100%; text-align: center; padding-top: 10px; }
            .music-info { justify-content: center; }
            h1 { font-size: 1.8rem; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Contenedor del fondo glitter -->
    <div class="glitter-container" id="glitterContainer"></div>
    <div id="stars"></div>

    <div class="neon-border-box">
        <div class="player-glass" id="player-container">
            <div class="left-side" id="side-left">
                <div class="couple-gif"></div>
                <div class="time-box">
                    <span id="current-date">---</span>
                    <span id="current-time">00:00:00</span>
                </div>
            </div>

            <div class="right-side">
                <h1>Oyheaaa!...</h1>
                <div class="music-info">
                    <div class="vinilo">
                        <img id="album-art" src="https://img1.picmix.com/output/pic/normal/4/7/2/6/11696274_571fd.gif" alt="Cover">
                    </div>
                    <div class="text-data">
                        <span id="track-title">Oyeahh</span>
                        <span id="artist-name">(0000000).</span>
                    </div>
                </div>

                <div class="audio-controls">
                    <i class="fas fa-play" id="playBtn" onclick="togglePlay()"></i>
                    <i class="fas fa-volume-up" id="muteBtn" onclick="toggleMute()"></i>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.5" oninput="changeVolume(this.value)">
                </div>

                <div class="listeners">
                    <span>
                        <span id="status-indicator" class="w-1.5 h-1.5 rounded-full" style="display:inline-block; width:7px; height:7px; background-color:#22c55e;"></span> 
                        <span id="status-text">VERIFICANDO...</span>
                    </span>
                    <span><i class="fas fa-heart" style="color:var(--accent);"></i> MODO ROMÁNTICO</span>
                </div>
            </div>
        </div>
    </div>

    <div class="firma-creador">Desings:  ☬ TemerX™</div>

    <audio id="bgMusic" loop>
        <source src="https://www.image2url.com/r2/default/audio/1785475401390-61b1c014-cfaf-4a85-befb-7129a8f858ed.mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        const muteBtn = document.getElementById('muteBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const player = document.getElementById('player-container');
        const sideLeft = document.getElementById('side-left');

        let heartInterval;
        music.volume = 0.5;

        function updateClock() {
            const now = new Date();
            const dateOptions = { weekday: 'long', day: 'numeric', month: 'short' };
            document.getElementById('current-date').innerText = now.toLocaleDateString('es-ES', dateOptions);
            document.getElementById('current-time').innerText = now.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
        }
        setInterval(updateClock, 1000); updateClock();

        function spawnBackHeart() {
            if (music.paused) return;
            const h = document.createElement('i');
            h.className = 'fas fa-heart back-heart';
            h.style.setProperty('--x', (Math.random() - 0.5) * 100 + 'px');
            sideLeft.appendChild(h);
            setTimeout(() => h.remove(), 2500);
        }

        function playMusic() {
            music.play().then(() => {
                playBtn.className = "fas fa-pause";
                player.classList.add('playing');
                if(!heartInterval) heartInterval = setInterval(spawnBackHeart, 450);
            }).catch(error => {
                console.log("Esperando interacción del usuario para reproducir...");
            });
        }

        window.addEventListener('load', playMusic);

        document.body.addEventListener('click', () => {
            if (music.paused) playMusic();
        }, { once: true });

        function togglePlay() {
            if (music.paused) {
                playMusic();
            } else {
                music.pause();
                playBtn.className = "fas fa-play";
                player.classList.remove('playing');
                clearInterval(heartInterval);
                heartInterval = null;
            }
        }

        function toggleMute() {
            if (music.muted) { 
                music.muted = false; 
                muteBtn.className = "fas fa-volume-up"; 
            } else { 
                music.muted = true; 
                muteBtn.className = "fas fa-volume-mute"; 
            }
        }

        function changeVolume(val) {
            music.volume = val;
            muteBtn.className = val == 0 ? "fas fa-volume-mute" : "fas fa-volume-up";
            if(val > 0) music.muted = false;
        }

        for (let i = 0; i < 40; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.left = Math.random() * 100 + 'vw'; s.style.top = Math.random() * 100 + 'vh';
            s.style.width = s.style.height = Math.random() * 2 + 'px';
            s.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            document.body.appendChild(s);
        }

        // --- GENERADOR DE GLITTER EN EL FONDO ---
        const glitterContainer = document.getElementById('glitterContainer');
        for (let i = 0; i < 50; i++) {
            const g = document.createElement('div');
            g.className = 'glitter';
            g.style.left = Math.random() * 100 + 'vw';
            g.style.top = Math.random() * 100 + 'vh';
            const size = (Math.random() * 3 + 2) + 'px';
            g.style.width = size;
            g.style.height = size;
            g.style.setProperty('--duration', (Math.random() * 2 + 1) + 's');
            g.style.setProperty('--moveDuration', (Math.random() * 4 + 2) + 's');
            glitterContainer.appendChild(g);
        }

        // --- FETCH ONLINE STATUS ---
        async function fetchOnlineStatus() {
            try {
                const response = await fetch('https://illuxat.com/api/online/RaphaeLDRZM');
                const text = await response.text();
                const statusText = document.getElementById('status-text');
                const statusIndicator = document.getElementById('status-indicator');
                
                let isOnline = false;
                
                try {
                    const data = JSON.parse(text);
                    if (data && data.data && data.data.status === "Online") {
                        isOnline = true;
                    } else if (data && data.status === "Online") {
                        isOnline = true;
                    } else if (data === "Online") {
                        isOnline = true;
                    }
                } catch (e) {
                    const cleanText = text.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                    if (cleanText === "online" || cleanText === "1" || cleanText === "true") {
                        isOnline = true;
                    }
                }
                
                if (isOnline) {
                    statusText.innerText = "EN LÍNEA";
                    statusIndicator.style.backgroundColor = "#22c55e";
                } else {
                    statusText.innerText = "AUSENTE";
                    statusIndicator.style.backgroundColor = "#f97316";
                }
            } catch (error) {
                console.error("Error fetching online status:", error);
                const statusText = document.getElementById('status-text');
                const statusIndicator = document.getElementById('status-indicator');
                statusText.innerText = "DESCONECTADO";
                statusIndicator.style.backgroundColor = "#ef4444";
            }
        }
        
        fetchOnlineStatus();
    </script>
</body>
</html>
