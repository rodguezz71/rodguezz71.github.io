<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEST3</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            background-image: url('https://xatimg.com/image/kDW0ybwbs5LP.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            cursor: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- CHAT BACKDROP --- */
        .chat-backdrop {
            position: absolute; 
            top: 93px; 
            left: 50.25%; 
            transform: translateX(-50%);
            width: 728px; 
            height: 486px; 
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            z-index: 5; 
            pointer-events: none; 
            overflow: hidden; 
            background-image: url('https://xatimg.com/image/r154ucQ2qNWe.jpg');
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            opacity: 0.86;
        }

        .chat-backdrop::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, rgba(0, 174, 255, 0.9));
            animation: girarBorde 4s linear infinite;
            z-index: -2;
        }

        @keyframes girarBorde {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- LOGO IZQUIERDO --- */
        .left-logo-container {
            position: absolute;
            top: 85px;
            left: 40px;
            z-index: 10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            pointer-events: none;
            animation: flotarBloque 4s ease-in-out infinite;
        }

        @keyframes flotarBloque {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .left-logo-subtitle {
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: #00aeff;
            font-weight: 600;
            margin-bottom: 3px;
            text-shadow: 0 0 8px rgba(0, 174, 255, 0.8);
        }

        .left-logo-title {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 4px;
            line-height: 1;
            margin: 0 0 5px 0;
            background: linear-gradient(270deg, #ff0055, #00aeff, #00ffcc, #ff0055);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: coloresEnMovimiento 6s ease infinite;
            filter: drop-shadow(0 0 15px rgba(0, 174, 255, 0.6));
        }

        @keyframes coloresEnMovimiento {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .left-logo-url {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 1px;
        }

        /* --- RECUADRO NOTICIAS CON EFECTO 3D --- */
        .news-backdrop {
            position: absolute;
            top: 260px;
            left: 40px;
            width: 280px;
            height: 318px;
            border-radius: 16px;
            border: 1px solid rgba(255, 0, 85, 0.4);
            background: rgba(20, 0, 25, 0.85);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 25px rgba(255, 0, 85, 0.3);
            z-index: 20;
            padding: 18px;
            box-sizing: border-box;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;

            /* Propiedades 3D */
            transform: perspective(900px) rotateY(10deg) rotateX(4deg);
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease;
        }

        .news-backdrop:hover {
            transform: perspective(900px) rotateY(0deg) rotateX(0deg) translateZ(25px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9), 0 0 35px rgba(255, 0, 85, 0.6);
        }

        .news-header {
            border-bottom: 1px solid rgba(255, 0, 85, 0.3);
            padding-bottom: 8px;
            margin-bottom: 12px;
            text-align: center;
            transform: translateZ(15px);
        }

        .news-backdrop h3 {
            margin: 0;
            color: #ff0055;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.9);
            font-size: 1.1rem;
        }

        .news-content {
            flex-grow: 1;
            overflow-y: auto;
            transform: translateZ(10px);
        }

        .news-backdrop ul {
            padding-left: 18px;
            margin: 0;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .news-backdrop li {
            margin-bottom: 10px;
        }

        /* --- RECUADRO REGLAS CON EFECTO 3D --- */
        .rules-backdrop {
            position: absolute;
            top: 93px;
            right: 40px;
            width: 280px;
            height: 486px;
            border-radius: 16px;
            border: 1px solid rgba(0, 174, 255, 0.4);
            background: rgba(0, 20, 40, 0.85);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 174, 255, 0.35);
            z-index: 20;
            padding: 20px;
            box-sizing: border-box;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;

            /* Propiedades 3D */
            transform: perspective(900px) rotateY(-10deg) rotateX(4deg);
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease;
        }

        .rules-backdrop:hover {
            transform: perspective(900px) rotateY(0deg) rotateX(0deg) translateZ(25px);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0, 174, 255, 0.7);
        }

        .rules-header {
            border-bottom: 1px solid rgba(0, 174, 255, 0.3);
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-align: center;
            transform: translateZ(15px);
        }

        .rules-backdrop h3 {
            margin: 0;
            color: #00aeff;
            text-shadow: 0 0 10px rgba(0, 174, 255, 0.9);
            font-size: 1.1rem;
        }

        .rules-content {
            flex-grow: 1;
            overflow-y: auto;
            transform: translateZ(10px);
        }

        .rules-backdrop ul {
            padding-left: 20px;
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .rules-backdrop li {
            margin-bottom: 10px;
        }

        /* --- BOTONES DE IDIOMA --- */
        .lang-buttons-container {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 15px;
            border-top: 1px solid rgba(0, 174, 255, 0.3);
            padding-top: 12px;
            transform: translateZ(20px);
            pointer-events: auto;
        }

        .lang-btn {
            flex: 1;
            background: rgba(0, 174, 255, 0.2);
            border: 1px solid rgba(0, 174, 255, 0.6);
            color: #ffffff;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .lang-btn:hover {
            background: rgba(0, 174, 255, 0.5);
            box-shadow: 0 0 12px rgba(0, 174, 255, 0.8);
            transform: translateY(-2px);
        }

        .lang-btn.active {
            background: rgba(0, 174, 255, 0.8);
            border-color: #00aeff;
            box-shadow: 0 0 15px rgba(0, 174, 255, 0.9);
        }

        /* --- FIRMA --- */
        .firma-creador {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            z-index: 50; 
            pointer-events: none; 
            color: #999999;
            opacity: 0.6;
        }

        /* --- CURSOR --- */
        #cursor-punto {
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            background-color: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.9), 0 0 20px rgba(0, 174, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="chat-backdrop"></div>

    <div class="left-logo-container">
        <div class="left-logo-subtitle">INTERNATIONAL ROOM</div>
        <h1 class="left-logo-title">NEST</h1>
        <div class="left-logo-url">xat.com/NEST</div>
    </div>

    <!-- Noticias (Con 3D) -->
    <div class="news-backdrop">
        <div class="news-header">
            <h3 id="news-title">NOTICIAS</h3>
        </div>
        <div class="news-content">
            <ul id="news-list"></ul>
        </div>
    </div>

    <!-- Reglas (Con 3D) -->
    <div class="rules-backdrop">
        <div class="rules-header">
            <h3 id="rules-title">REGLAS</h3>
        </div>
        <div class="rules-content">
            <ul id="rules-list"></ul>
        </div>
        <div class="lang-buttons-container">
            <button class="lang-btn active" id="btn-es" data-lang="es">ESP</button>
            <button class="lang-btn" id="btn-en" data-lang="en">ENG</button>
            <button class="lang-btn" id="btn-pt" data-lang="pt">POR</button>
        </div>
    </div>

    <div class="firma-creador">Desings: ☬ TemerX™</div>
    <div id="cursor-punto"></div>
    <canvas id="canvas"></canvas>

    <script>
        const contenidoTraducciones = {
            es: {
                reglasTitulo: "REGLAS DEL SITIO",
                reglas: [
                    "Mantén el respeto hacia todos los usuarios en la comunidad.",
                    "No compartas información personal o sensible en el chat público.",
                    "Evita el spam o el uso excesivo de mayúsculas.",
                    "Sigue las indicaciones de los moderadores en todo momento.",
                    "Disfruta de la experiencia visual y diviértete."
                ],
                noticiasTitulo: "NOTICIAS",
                noticias: [
                    "¡Bienvenidos a la nueva actualización de la sala NEST!",
                    "Nuevos eventos y efectos visuales disponibles este fin de semana.",
                    "Consulta con nuestros moderadores para participar en dinámicas."
                ]
            },
            en: {
                reglasTitulo: "SITE RULES",
                reglas: [
                    "Maintain respect towards all users in the community.",
                    "Do not share personal or sensitive info in the public chat.",
                    "Avoid spamming or excessive use of capital letters.",
                    "Follow the instructions of the moderators at all times.",
                    "Enjoy the visual experience and have fun."
                ],
                noticiasTitulo: "NEWS",
                noticias: [
                    "Welcome to the new NEST room update!",
                    "New events and visual effects available this weekend.",
                    "Check with our moderators to participate in activities."
                ]
            },
            pt: {
                reglasTitulo: "REGRAS DO SITE",
                reglas: [
                    "Mantenha o respeito por todos os usuários da comunidade.",
                    "Não compartilhe informações pessoais ou sensíveis no chat público.",
                    "Evite spam ou uso excessivo de letras maiúsculas.",
                    "Siga as instruções dos moderadores o tempo todo.",
                    "Aproveite a experiência visual e divirta-se."
                ],
                noticiasTitulo: "NOTÍCIAS",
                noticias: [
                    "Bem-vindos à nova atualização da sala NEST!",
                    "Novos eventos e efeitos visuais disponíveis neste fim de semana.",
                    "Consulte nossos moderadores para participar das dinâmicas."
                ]
            }
        };

        function cambiarIdioma(lang) {
            const data = contenidoTraducciones[lang];
            if (!data) return;
            
            document.getElementById('rules-title').innerText = data.reglasTitulo;
            const listaReglas = document.getElementById('rules-list');
            listaReglas.innerHTML = '';
            data.reglas.forEach(regla => {
                const li = document.createElement('li');
                li.innerText = regla;
                listaReglas.appendChild(li);
            });

            document.getElementById('news-title').innerText = data.noticiasTitulo;
            const listaNoticias = document.getElementById('news-list');
            listaNoticias.innerHTML = '';
            data.noticias.forEach(noticia => {
                const li = document.createElement('li');
                li.innerText = noticia;
                listaNoticias.appendChild(li);
            });

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${lang}`);
            if (activeBtn) activeBtn.classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.lang-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    const lang = e.target.getAttribute('data-lang');
                    cambiarIdioma(lang);
                });
            });
            cambiarIdioma('es');
        });

        const cursorPunto = document.getElementById('cursor-punto');
        document.addEventListener('mousemove', (e) => {
            cursorPunto.style.transform = `translate(${e.clientX - 4}px, ${e.clientY - 4}px)`;
        });

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let nodes = [];
        const numNodes = 80;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        }

        window.addEventListener('resize', resizeCanvas);
        
        class Node {
            constructor(x, y) {
                this.baseX = x;
                this.baseY = y;
                this.x = x;
                this.y = y;
                this.color = Math.random() > 0.5 ? '#ff0055' : '#00aeff';
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 0.005 + Math.random() * 0.01;
                this.range = 20 + Math.random() * 30;
            }

            update() {
                this.angle += this.speed;
                this.x = this.baseX + Math.cos(this.angle) * this.range;
                this.y = this.baseY + Math.sin(this.angle * 1.5) * this.range;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function init() {
            nodes = [];
            const w = canvas.width;
            const h = canvas.height;
            const cols = Math.floor(Math.sqrt(numNodes * w / h));
            const rows = Math.ceil(numNodes / cols);
            const cellW = w / cols;
            const cellH = h / rows;

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    const x = i * cellW + cellW / 2;
                    const y = j * cellH + cellH / 2;
                    nodes.push(new Node(x, y));
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    let n1 = nodes[i];
                    let n2 = nodes[j];
                    let dx = n1.x - n2.x;
                    let dy = n1.y - n2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) { 
                        let alpha = (1 - (dist / 120)) * 0.2;
                        ctx.beginPath();
                        ctx.moveTo(n1.x, n1.y);
                        ctx.lineTo(n2.x, n2.y);
                        ctx.strokeStyle = n1.color === '#ff0055' 
                            ? `rgba(255, 0, 85, ${alpha})` 
                            : `rgba(0, 174, 255, ${alpha})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }

            for (let i = 0; i < nodes.length; i++) {
                nodes[i].update();
                nodes[i].draw();
            }
            requestAnimationFrame(animate);
        }

        resizeCanvas();
        animate();
    </script>
</body>
</html>
