<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEST1.2</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            background-image: url('https://xatimg.com/image/kDW0ybwbs5LP.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            cursor: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- ESTILO CHAT BACKDROP CON BORDE ANIMADO AZUL --- */
        .chat-backdrop {
            position: absolute; 
            top: 93px; 
            left: 50.25%; 
            transform: translateX(-50%);
            width: 728px; 
            height: 486px; 
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            z-index: 5; 
            pointer-events: none; 
            overflow: hidden; 
            background-image: url('https://xatimg.com/image/r154ucQ2qNWe.jpg');
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            opacity: 0.86;
            isolation: isolate;
        }

        .chat-backdrop::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                transparent, 
                transparent, 
                transparent, 
                rgba(0, 174, 255, 0.9)
            );
            animation: girarBorde 4s linear infinite;
            z-index: -2;
        }

        .chat-backdrop::after {
            content: '';
            position: absolute;
            inset: 1px;
            border-radius: 15px;
            background: inherit;
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        @keyframes girarBorde {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- LOGO IZQUIERDO ANIMADO --- */
        .left-logo-container {
            position: absolute;
            top: 85px;
            left: 40px;
            z-index: 10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            pointer-events: none;
            animation: flotarBloque 4s ease-in-out infinite;
        }

        @keyframes flotarBloque {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .left-logo-subtitle {
            font-size: 0.8rem;
            letter-spacing: 3px;
            color: #00aeff;
            font-weight: 600;
            margin-bottom: 3px;
            text-shadow: 0 0 8px rgba(0, 174, 255, 0.8);
        }

        .left-logo-title {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: 4px;
            line-height: 1;
            margin: 0 0 5px 0;
            background: linear-gradient(270deg, #ff0055, #00aeff, #00ffcc, #ff0055);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: coloresEnMovimiento 6s ease infinite;
            filter: drop-shadow(0 0 15px rgba(0, 174, 255, 0.6));
        }

        @keyframes coloresEnMovimiento {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .left-logo-url {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 1px;
        }

        /* --- RECUADRO DE NOTICIAS A LA IZQUIERDA --- */
        .news-backdrop {
            position: absolute;
            top: 260px;
            left: 40px;
            width: 280px;
            height: 318px;
            border-radius: 16px;
            border: 1px solid rgba(255, 0, 85, 0.4);
            background: rgba(20, 0, 25, 0.8);
            backdrop-filter: blur(12px);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.7), 
                0 0 25px rgba(255, 0, 85, 0.3),
                inset 0 0 15px rgba(255, 0, 85, 0.15);
            z-index: 20;
            padding: 18px;
            box-sizing: border-box;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            pointer-events: auto;
            display: flex;
            flex-direction: column;

            transform: perspective(800px) rotateY(10deg) rotateX(4deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .news-backdrop:hover {
            transform: perspective(800px) rotateY(0deg) rotateX(0deg) scale(1.02);
            box-shadow: 
                0 40px 80px rgba(0, 0, 0, 0.9), 
                0 0 35px rgba(255, 0, 85, 0.6),
                inset 0 0 20px rgba(255, 0, 85, 0.3);
        }

        .news-header {
            border-bottom: 1px solid rgba(255, 0, 85, 0.3);
            padding-bottom: 8px;
            margin-bottom: 12px;
            text-align: center;
        }

        .news-backdrop h3 {
            margin: 0;
            color: #ff0055;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.9), 0 2px 4px rgba(0,0,0,0.8);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .news-content {
            flex-grow: 1;
            overflow-y: auto;
        }

        .news-backdrop ul {
            padding-left: 18px;
            margin: 0;
            font-size: 0.85rem;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.9);
        }

        .news-backdrop li {
            margin-bottom: 10px;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.4), 0 1px 2px rgba(0,0,0,0.8);
        }

        /* --- RECUADRO DE REGLAS CON EFECTO 3D (Derecha) --- */
        .rules-backdrop {
            position: absolute;
            top: 93px;
            right: 40px;
            width: 280px;
            height: 486px;
            border-radius: 16px;
            border: 1px solid rgba(0, 174, 255, 0.4);
            background: rgba(0, 20, 40, 0.8);
            backdrop-filter: blur(12px);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.7), 
                0 0 25px rgba(0, 174, 255, 0.35),
                inset 0 0 15px rgba(0, 174, 255, 0.15);
            z-index: 20;
            padding: 20px;
            box-sizing: border-box;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            pointer-events: auto;
            display: flex;
            flex-direction: column;

            transform: perspective(800px) rotateY(-10deg) rotateX(4deg);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .rules-backdrop:hover {
            transform: perspective(800px) rotateY(0deg) rotateX(0deg) scale(1.02);
            box-shadow: 
                0 40px 80px rgba(0, 0, 0, 0.9), 
                0 0 35px rgba(0, 174, 255, 0.7),
                inset 0 0 20px rgba(0, 174, 255, 0.3);
        }

        .rules-header {
            border-bottom: 1px solid rgba(0, 174, 255, 0.3);
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .rules-backdrop h3 {
            margin: 0;
            color: #00aeff;
            text-shadow: 0 0 10px rgba(0, 174, 255, 0.9), 0 2px 4px rgba(0,0,0,0.8);
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .rules-content {
            flex-grow: 1;
            overflow-y: auto;
        }

        .rules-backdrop ul {
            padding-left: 20px;
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
        }

        .rules-backdrop li {
            margin-bottom: 10px;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.4), 0 1px 2px rgba(0,0,0,0.8);
        }

        /* --- BOTONES DE IDIOMA --- */
        .lang-buttons-container {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 15px;
            border-top: 1px solid rgba(0, 174, 255, 0.3);
            padding-top: 12px;
            position: relative;
            z-index: 30;
        }

        .lang-btn {
            flex: 1;
            background: rgba(0, 174, 255, 0.2);
            border: 1px solid rgba(0, 174, 255, 0.6);
            color: #ffffff;
            padding: 8px 0;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            text-shadow: 0 0 6px rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            pointer-events: auto;
        }

        .lang-btn:hover {
            background: rgba(0, 174, 255, 0.5);
            box-shadow: 0 0 12px rgba(0, 174, 255, 0.8);
            transform: translateY(-2px);
        }

        .lang-btn.active {
            background: rgba(0, 174, 255, 0.8);
            border-color: #00aeff;
            box-shadow: 0 0 15px rgba(0, 174, 255, 0.9);
        }

        /* --- LOGO TABS SUPERIOR CENTRO --- */
        .logo-tabs {
            position: absolute; 
            right: calc(50.25% - 189px + 10px); 
            top: 446px;
            transform: translateY(-50%); 
            z-index: 11; 
            text-align: right;
            background: rgba(15, 25, 40, 0.8); 
            padding: 4px 16px;
            border-radius: 10px 10px 0 0; 
            border: 1px solid rgba(255,255,255,0.1); 
            border-bottom: none;
            isolation: isolate;
        }
        
        .logo-tabs .logo-text {
            font-family: 'Outfit', sans-serif; 
            font-size: 0.8rem; 
            letter-spacing: 2px; 
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 16px rgba(74, 144, 226, 0.22);
            position: relative;
            z-index: 2;
            display: inline-flex; 
        }

        .logo-tabs .logo-text span {
            display: inline-block;
            animation: escribirYBrincarSutil 5s infinite ease-in-out;
        }

        .logo-tabs .logo-text span:nth-child(1) { animation-delay: 0.0s; }
        .logo-tabs .logo-text span:nth-child(2) { animation-delay: 0.1s; }
        .logo-tabs .logo-text span:nth-child(3) { animation-delay: 0.2s; }
        .logo-tabs .logo-text span:nth-child(4) { animation-delay: 0.3s; }

        @keyframes escribirYBrincarSutil {
            0% { opacity: 0; transform: translateY(6px) scale(0.95); }
            10% { opacity: 1; transform: translateY(-2px) scale(1.03); }
            20% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* --- FIRMA DEL CREADOR --- */
        .firma-creador {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            z-index: 50; 
            pointer-events: none; 
            animation: colorFirma 4s infinite alternate ease-in-out;
        }

        @keyframes colorFirma {
            0% { color: #555555; opacity: 0.3; text-shadow: 0 0 2px rgba(85,85,85,0.2); } 
            50% { color: #e0e0e0; opacity: 0.7; text-shadow: 0 0 8px rgba(224,224,224,0.6); } 
            100% { color: #999999; opacity: 0.4; text-shadow: 0 0 4px rgba(153,153,153,0.3); } 
        }

        /* --- CURSOR NEÓN Y RASTRO --- */
        #cursor-punto {
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            background-color: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 
                0 0 6px rgba(255, 255, 255, 0.9),
                0 0 12px rgba(255, 255, 255, 0.5),
                0 0 20px rgba(0, 174, 255, 0.6);
            transition: transform 0.05s ease-out;
            will-change: transform;
        }

        #rastro-contenedor {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9998;
        }

        .rastro-punto {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
            animation: fadeOut 0.5s forwards ease-out;
        }

        @keyframes fadeOut {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(0.1); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Chat Backdrop -->
    <div class="chat-backdrop"></div>

    <!-- Bloque Logo Izquierdo -->
    <div class="left-logo-container">
        <div class="left-logo-subtitle">INTERNATIONAL ROOM</div>
        <h1 class="left-logo-title">NEST</h1>
        <div class="left-logo-url">xat.com/NEST</div>
    </div>

    <!-- Recuadro Noticias -->
    <div class="news-backdrop">
        <div class="news-header">
            <h3 id="news-title">NOTICIAS</h3>
        </div>
        <div class="news-content">
            <ul id="news-list"></ul>
        </div>
    </div>

    <!-- Recuadro Reglas -->
    <div class="rules-backdrop">
        <div class="rules-header">
            <h3 id="rules-title">REGLAS</h3>
        </div>
        <div class="rules-content">
            <ul id="rules-list"></ul>
        </div>
        <div class="lang-buttons-container">
            <button class="lang-btn active" id="btn-es" onclick="cambiarIdioma('es')">ESP</button>
            <button class="lang-btn" id="btn-en" onclick="cambiarIdioma('en')">ENG</button>
            <button class="lang-btn" id="btn-pt" onclick="cambiarIdioma('pt')">POR</button>
        </div>
    </div>

    <!-- Logo Tabs -->
    <div class="logo-tabs">
        <div class="logo-text">
            <span>N</span><span>E</span><span>S</span><span>T</span>
        </div>
    </div>

    <!-- Firma -->
    <div class="firma-creador">Desings: ☬ TemerX™</div>

    <!-- Cursor y Red -->
    <div id="cursor-punto"></div>
    <div id="rastro-contenedor"></div>
    <canvas id="canvas"></canvas>

    <script>
        // --- DICCIONARIO DE IDIOMAS ---
        const contenidoTraducciones = {
            es: {
                reglasTitulo: "REGLAS DEL SITIO",
                reglas: [
                    "Mantén el respeto hacia todos los usuarios en la comunidad.",
                    "No compartas información personal o sensible en el chat público.",
                    "Evita el spam o el uso excesivo de mayúsculas.",
                    "Sigue las indicaciones de los moderadores en todo momento.",
                    "Disfruta de la experiencia visual y diviértete."
                ],
                noticiasTitulo: "NOTICIAS",
                noticias: [
                    "¡Bienvenidos a la nueva actualización de la sala NEST!",
                    "Nuevos eventos y efectos visuales disponibles este fin de semana.",
                    "Consulta con nuestros moderadores para participar en dinámicas."
                ]
            },
            en: {
                reglasTitulo: "SITE RULES",
                reglas: [
                    "Maintain respect towards all users in the community.",
                    "Do not share personal or sensitive info in the public chat.",
                    "Avoid spamming or excessive use of capital letters.",
                    "Follow the instructions of the moderators at all times.",
                    "Enjoy the visual experience and have fun."
                ],
                noticiasTitulo: "NEWS",
                noticias: [
                    "Welcome to the new NEST room update!",
                    "New events and visual effects available this weekend.",
                    "Check with our moderators to participate in activities."
                ]
            },
            pt: {
                reglasTitulo: "REGRAS DO SITE",
                reglas: [
                    "Mantenha o respeito por todos os usuários da comunidade.",
                    "Não compartilhe informações pessoais ou sensíveis no chat público.",
                    "Evite spam ou uso excessivo de letras maiúsculas.",
                    "Siga as instruções dos moderadores o tempo todo.",
                    "Aproveite a experiência visual e divirta-se."
                ],
                noticiasTitulo: "NOTÍCIAS",
                noticias: [
                    "Bem-vindos à nova atualização da sala NEST!",
                    "Novos eventos e efeitos visuais disponíveis neste fim de semana.",
                    "Consulte nossos moderadores para participar das dinâmicas."
                ]
            }
        };

        function cambiarIdioma(lang) {
            const data = contenidoTraducciones[lang];
            
            document.getElementById('rules-title').innerText = data.reglasTitulo;
            const listaReglas = document.getElementById('rules-list');
            listaReglas.innerHTML = '';
            data.reglas.forEach(regla => {
                const li = document.createElement('li');
                li.innerText = regla;
                listaReglas.appendChild(li);
            });

            document.getElementById('news-title').innerText = data.noticiasTitulo;
            const listaNoticias = document.getElementById('news-list');
            listaNoticias.innerHTML = '';
            data.noticias.forEach(noticia => {
                const li = document.createElement('li');
                li.innerText = noticia;
                listaNoticias.appendChild(li);
            });

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');
        }

        cambiarIdioma('es');

        // --- SCRIPT CURSOR ---
        const cursorPunto = document.getElementById('cursor-punto');
        const rastroContenedor = document.getElementById('rastro-contenedor');
        
        let cursorX = 0;
        let cursorY = 0;
        let ratonDentro = false;

        document.addEventListener('mousemove', (e) => {
            cursorX = e.clientX;
            cursorY = e.clientY;
            ratonDentro = true;
            cursorPunto.style.transform = `translate(${cursorX - 4}px, ${cursorY - 4}px)`;
        });

        document.addEventListener('mouseleave', () => {
            ratonDentro = false;
            cursorPunto.style.opacity = '0';
        });
        
        document.addEventListener('mouseenter', () => {
            ratonDentro = true;
            cursorPunto.style.opacity = '1';
        });

        function gestionarRastro() {
            if (ratonDentro) {
                const rastroPunto = document.createElement('div');
                rastroPunto.classList.add('rastro-punto');
                rastroPunto.style.left = `${cursorX - 3}px`;
                rastroPunto.style.top = `${cursorY - 3}px`;
                rastroContenedor.appendChild(rastroPunto);
                
                setTimeout(() => {
                    rastroPunto.remove();
                }, 500);
            }
            requestAnimationFrame(gestionarRastro);
        }
        gestionarRastro();

        // --- SCRIPT CANVAS NEÓN ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let nodes = [];
        const numNodes = 160; 

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        }

        window.addEventListener('resize', resizeCanvas);
        
        class Node {
            constructor(x, y) {
                this.baseX = x;
                this.baseY = y;
                this.x = x;
                this.y = y;
                this.color = Math.random() > 0.5 ? '#ff0055' : '#00aeff';
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 0.005 + Math.random() * 0.01;
                this.range = 20 + Math.random() * 30;
            }

            update() {
                this.angle += this.speed;
                this.x = this.baseX + Math.cos(this.angle) * this.range;
                this.y = this.baseY + Math.sin(this.angle * 1.5) * this.range;

                if(this.x < 0 || this.x > canvas.width) this.speed *= -1;
                if(this.y < 0 || this.y > canvas.height) this.speed *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function init() {
            nodes = [];
            const w = canvas.width;
            const h = canvas.height;
            const cols = Math.floor(Math.sqrt(numNodes * w / h));
            const rows = Math.ceil(numNodes / cols);
            const cellW = w / cols;
            const cellH = h / rows;

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    const x = i * cellW + cellW / 2 + (Math.random() - 0.5) * cellW * 0.5;
                    const y = j * cellH + cellH / 2 + (Math.random() - 0.5) * cellH * 0.5;
                    nodes.push(new Node(x, y));
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    let n1 = nodes[i];
                    let n2 = nodes[j];
                    let dx = n1.x - n2.x;
                    let dy = n1.y - n2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 150) { 
                        let alpha = (1 - (dist / 150)) * 0.25;
                        ctx.beginPath();
                        ctx.moveTo(n1.x, n1.y);
                        ctx.lineTo(n2.x, n2.y);
                        ctx.strokeStyle = n1.color === '#ff0055' 
                            ? `rgba(255, 0, 85, ${alpha})` 
                            : `rgba(0, 174, 255, ${alpha})`;
                        ctx.lineWidth = 0.8;
                        ctx.stroke();
                    }
                }
            }

            for (let i = 0; i < nodes.length; i++) {
                nodes[i].update();
                nodes[i].draw();
            }

            requestAnimationFrame(animate);
        }

        resizeCanvas();
        animate();
    </script>
</body>
</html>
