<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>LEGION RADIO</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Rubik+Glitch&display=swap" rel="stylesheet">
	
	<style>
		:root {
			--red-pure: #ff0011;
			--red-bright: #ff3300;
			--red-deep: #800000;
			--orange-fire: #ff6600;
		}

		body, html {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: url("https://xatimg.com/image/tiXBKAAf8IoX.png");
			background-size: cover;
			background-repeat: no-repeat;
			background-position: center;
		}

		.chat-backdrop {
			position: absolute;
			top: 93px;
			left: 50.25%;
			transform: translateX(-50%);
			width: 728px;
			height: 486px;
			border-radius: 16px;
			box-shadow: 0 20px 50px rgba(0,0,0,0.8);
			z-index: 10;
			pointer-events: none;
			overflow: hidden;
			background-image: url('https://xatimg.com/image/oMVD6aRkxWXy.png');
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			opacity: 0.88;
		}

		.logo-tabs {
			position: absolute;
			right: calc(50.25% - 189px + 10px);
			top: 446px;
			transform: translateY(-50%);
			z-index: 11;
			text-align: right;
			background: rgba(15, 0, 0, 0.85);
			padding: 4px 16px;
			border-radius: 10px 10px 0 0;
			border: 1px solid rgba(255,0,17,0.2);
			border-bottom: none;
			isolation: isolate;
		}
		
		.logo-tabs .logo-text {
			font-family: 'Metal Mania', cursive;
			font-size: 1rem;
			letter-spacing: 2px;
			font-weight: 400;
			color: #ffffff;
			text-shadow: 0 0 16px rgba(255, 0, 17, 0.6);
			position: relative;
			z-index: 2;
			display: inline-flex;
		}

		.logo-tabs .logo-text span {
			display: inline-block;
			animation: escribirYBrincarSutil 5s infinite ease-in-out;
		}

		.logo-tabs .logo-text span:nth-child(1) { animation-delay: 0.0s; }
		.logo-tabs .logo-text span:nth-child(2) { animation-delay: 0.1s; }
		.logo-tabs .logo-text span:nth-child(3) { animation-delay: 0.2s; }
		.logo-tabs .logo-text span:nth-child(4) { animation-delay: 0.3s; }
		.logo-tabs .logo-text span:nth-child(5) { animation-delay: 0.4s; }
		.logo-tabs .logo-text span:nth-child(6) { animation-delay: 0.5s; }

		@keyframes escribirYBrincarSutil {
			0% { opacity: 0; transform: translateY(6px) scale(0.95); }
			10% { opacity: 1; transform: translateY(-2px) scale(1.03); }
			20% { opacity: 1; transform: translateY(0) scale(1); }
			100% { opacity: 1; transform: translateY(0) scale(1); }
		}

		.bottom-text-container {
			position: absolute;
			bottom: 45px;
			left: 50%;
			transform: translateX(-50%);
			text-align: center;
			z-index: 25;
			pointer-events: none;
			width: 100%;
		}

		.neon-title {
			font-family: 'Rubik Glitch', cursive;
			font-size: clamp(40px, 9vw, 105px);
			font-weight: 400;
			margin: 0;
			line-height: 1;
			letter-spacing: 4px;
			color: #ffffff;
			background: linear-gradient(180deg, #ffffff 0%, #ffbb99 35%, #ff0011 60%, #800000 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			filter: drop-shadow(0 0 10px #ffffff) drop-shadow(0 0 25px var(--red-pure)) drop-shadow(0 0 50px var(--orange-fire)) drop-shadow(0 0 90px var(--red-deep));
			display: inline-flex;
			animation: flotarSuave 3s infinite ease-in-out;
			white-space: nowrap;
		}

		.neon-title span {
			display: inline-block;
			animation: ondaLetras 2s infinite ease-in-out;
		}

		.neon-title span:nth-child(1)  { animation-delay: 0.0s; }
		.neon-title span:nth-child(2)  { animation-delay: 0.1s; }
		.neon-title span:nth-child(3)  { animation-delay: 0.2s; }
		.neon-title span:nth-child(4)  { animation-delay: 0.3s; }
		.neon-title span:nth-child(5)  { animation-delay: 0.4s; }
		.neon-title span:nth-child(6)  { animation-delay: 0.5s; }
		.neon-title span:nth-child(7)  { animation-delay: 0.6s; }
		.neon-title span:nth-child(8)  { animation-delay: 0.7s; }
		.neon-title span:nth-child(9)  { animation-delay: 0.8s; }
		.neon-title span:nth-child(10) { animation-delay: 0.9s; }
		.neon-title span:nth-child(11) { animation-delay: 1.0s; }
		.neon-title span:nth-child(12) { animation-delay: 1.1s; }

		@keyframes flotarSuave {
			0%, 100% {
				transform: translateY(0);
			}
			50% {
				transform: translateY(-8px);
			}
		}

		@keyframes ondaLetras {
			0%, 100% {
				transform: translateY(0);
			}
			50% {
				transform: translateY(-10px);
			}
		}

		/* Media query para adaptar contenedores en pantallas pequeñas o dispositivos móviles */
		@media (max-width: 768px) {
			.chat-backdrop {
				width: 92vw;
				height: 55vw;
				top: 70px;
			}
			.logo-tabs {
				top: calc(70px + 55vw - 22px);
				right: 5%;
			}
		}
	</style>
</head>

<body>
	<div class="chat-backdrop"></div>

	<div class="logo-tabs">
		<div class="logo-text">
			<span>L</span><span>E</span><span>G</span><span>I</span><span>O</span><span>N</span>
		</div>
	</div>

	<div class="bottom-text-container">
		<h1 class="neon-title">
			<span>L</span><span>E</span><span>G</span><span>I</span><span>O</span><span>N</span><span>&nbsp;</span><span>R</span><span>A</span><span>D</span><span>I</span><span>O</span>
		</h1>
	</div>
</body>

</html>
