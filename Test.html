<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Xatframe Backxatbox - Legion Radio</title>
	<!-- Fuente impactante y moderna desde Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
	
	<style>
		:root {
			--decoration-size: 16px;
			--gold-glow: #ffd700;
			--red-glow: #ff0000;
		}

		body, html {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSXogj_rWMdSxyaqzbURuxJnP4ozEjgZUogMsXNPfPSyQ&s=10");
			background-size: cover;
			background-repeat: no-repeat;
			background-position: center;
			cursor: none;
			perspective: 1200px;
		}

		#main-canvas {
			display: block;
			position: absolute;
			top: 0;
			left: 0;
			z-index: 1;
		}

		.neon-overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			pointer-events: none;
			background:
				radial-gradient(circle at 50% 50%,
					rgba(255, 50, 150, 0.15),
					transparent 70%);
			animation: neon-pulse 3s infinite;
			z-index: 2;
		}

		@keyframes neon-pulse {
			0%, 100% {
				opacity: 0.4;
				filter: blur(20px);
			}
			50% {
				opacity: 0.8;
				filter: blur(35px);
			}
		}

		/* --- ESTILO CHAT BACKDROP CON BORDE ANIMADO DORADO Y ROJO (Posición del primer código) --- */
		.chat-backdrop {
			position: absolute; 
			top: 93px; 
			left: 50.25%; 
			transform: translateX(-50%);
			width: 728px; 
			height: 486px; 
			border-radius: 16px;
			box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 35px rgba(255, 215, 0, 0.3);
			z-index: 10; 
			pointer-events: none; 
			overflow: hidden; 
			background-image: url('https://xatimg.com/image/elY0y7rDXXoR.png');
			background-size: cover; 
			background-position: center; 
			background-repeat: no-repeat;
			opacity: 0.86;
			isolation: isolate;
		}

		.chat-backdrop::before {
			content: '';
			position: absolute;
			top: -50%;
			left: -50%;
			width: 200%;
			height: 200%;
			background: conic-gradient(
				transparent, 
				transparent, 
				rgba(255, 0, 0, 0.9), 
				rgba(255, 215, 0, 0.9),
				transparent
			);
			animation: girarBorde 4s linear infinite;
			z-index: -2;
		}

		.chat-backdrop::after {
			content: '';
			position: absolute;
			inset: 1px;
			border-radius: 15px;
			background: inherit;
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			z-index: -1;
		}

		@keyframes girarBorde {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}

		/* --- LOGO TABS SUPERIOR CENTRO (Posición del primer código) --- */
		.logo-tabs {
			position: absolute; 
			right: calc(50.25% - 189px + 10px); 
			top: 446px;
			transform: translateY(-50%); 
			z-index: 11; 
			text-align: right;
			background: rgba(15, 25, 40, 0.8); 
			padding: 4px 16px;
			border-radius: 10px 10px 0 0; 
			border: 1px solid rgba(255,255,255,0.1); 
			border-bottom: none;
			isolation: isolate;
		}
		
		.logo-tabs .logo-text {
			font-family: 'Outfit', sans-serif; 
			font-size: 0.8rem; 
			letter-spacing: 2px; 
			font-weight: 700;
			color: #fff;
			text-shadow: 0 0 16px rgba(74, 144, 226, 0.22);
			position: relative;
			z-index: 2;
			display: inline-flex; 
		}

		.logo-tabs .logo-text span {
			display: inline-block;
			animation: escribirYBrincarSutil 5s infinite ease-in-out;
		}

		.logo-tabs .logo-text span:nth-child(1) { animation-delay: 0.0s; }
		.logo-tabs .logo-text span:nth-child(2) { animation-delay: 0.1s; }
		.logo-tabs .logo-text span:nth-child(3) { animation-delay: 0.2s; }
		.logo-tabs .logo-text span:nth-child(4) { animation-delay: 0.3s; }

		@keyframes escribirYBrincarSutil {
			0% { opacity: 0; transform: translateY(6px) scale(0.95); }
			10% { opacity: 1; transform: translateY(-2px) scale(1.03); }
			20% { opacity: 1; transform: translateY(0) scale(1); }
			100% { opacity: 1; transform: translateY(0) scale(1); }
		}

		/* --- ESTILO TEXTO INFERIOR EXTREMADAMENTE MÁS GRANDE Y LLAMATIVO --- */
		.bottom-text-container {
			position: absolute;
			bottom: 15px;
			left: 50%;
			transform: translateX(-50%);
			text-align: center;
			z-index: 25;
			pointer-events: none;
			width: 100%;
		}

		.neon-title {
			font-family: 'Kanit', sans-serif;
			font-size: 110px;
			font-weight: 900;
			font-style: italic;
			text-transform: uppercase;
			margin: 0;
			line-height: 1;
			letter-spacing: 6px;
			color: #ffffff;

			background: linear-gradient(180deg, #ffffff 0%, #ffdf73 35%, #d4af37 60%, #ff1100 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;

			filter: drop-shadow(0 0 10px #ffffff)
			        drop-shadow(0 0 25px var(--gold-glow))
			        drop-shadow(0 0 50px var(--red-glow))
			        drop-shadow(0 0 90px var(--red-glow));

			animation: neon-flicker-beat 2s infinite alternate;
		}

		@keyframes neon-flicker-beat {
			0%, 100% {
				transform: scale(1);
				filter: drop-shadow(0 0 10px #ffffff)
				        drop-shadow(0 0 25px var(--gold-glow))
				        drop-shadow(0 0 50px var(--red-glow))
				        drop-shadow(0 0 90px var(--red-glow));
			}
			50% {
				transform: scale(1.04);
				filter: drop-shadow(0 0 15px #ffffff)
				        drop-shadow(0 0 40px var(--gold-glow))
				        drop-shadow(0 0 70px var(--red-glow))
				        drop-shadow(0 0 120px var(--red-glow));
			}
			92% {
				opacity: 1;
			}
			93% {
				opacity: 0.4;
			}
			94% {
				opacity: 1;
			}
			96% {
				opacity: 0.2;
			}
			98% {
				opacity: 1;
			}
		}

		/* Contenedor Grid general para las 4 bocinas en las esquinas */
		.screen-layout {
			position: absolute;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			display: grid;
			grid-template-columns: 320px 1fr 320px;
			grid-template-rows: 320px 320px;
			gap: 10px;
			max-width: 100%;
			align-items: center;
			justify-items: center;
			z-index: 5;
			pointer-events: none;
		}

		.speaker {
			border-radius: 100%;
			background: linear-gradient(#333, black);
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 0 15px 30px rgba(0,0,0,0.7);
			pointer-events: auto;
		}

		/* Bocinas Superiores */
		.speaker-top {
			--speaker-size: 320px;
			width: var(--speaker-size);
			height: var(--speaker-size);
		}

		/* Bocinas Inferiores */
		.speaker-bottom {
			--speaker-size: 260px;
			width: var(--speaker-size);
			height: var(--speaker-size);
		}

		.speaker-top .decoration:nth-of-type(1) { left: 45px; top: 45px; }
		.speaker-top .decoration:nth-of-type(2) { right: 45px; top: 45px; left: auto; }
		.speaker-top .decoration:nth-of-type(3) { right: 45px; bottom: 45px; left: auto; top: auto; }
		.speaker-top .decoration:nth-of-type(4) { left: 45px; bottom: 45px; top: auto; }

		.speaker-bottom .decoration:nth-of-type(1) { left: 36px; top: 36px; }
		.speaker-bottom .decoration:nth-of-type(2) { right: 36px; top: 36px; left: auto; }
		.speaker-bottom .decoration:nth-of-type(3) { right: 36px; bottom: 36px; left: auto; top: auto; }
		.speaker-bottom .decoration:nth-of-type(4) { left: 36px; bottom: 36px; top: auto; }

		.decoration {
			position: absolute;
			width: var(--decoration-size);
			height: var(--decoration-size);
			border-radius: 100%;
			background: radial-gradient(gray, black);
			border: 2px solid #aaa;
		}

		/* Elementos Internos Bocina Superior */
		.speaker-top .inner {
			width: 240px;
			height: 240px;
			border-radius: 100%;
			background: #333;
			box-shadow: 0 0 30px black inset;
			border: 5px solid black;
			display: flex;
			align-items: center;
			justify-content: center;
			position: relative;
		}

		.speaker-top .cone {
			width: 105px;
			height: 105px;
			border-radius: 100%;
			background: radial-gradient(circle at 50% 20%, #ffdf73, #d4af37 2%, #8b0000 20%, black 70%);
			z-index: 10;
			animation: bounce .5s infinite;
			box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
		}

		.speaker-top .spring {
			position: absolute;
			background: #333;
			box-shadow: 0 0 25px inset black;
			border-radius: 100%;
			animation: spring .5s infinite;
		}

		.speaker-top .spring:nth-of-type(1) { width: 215px; height: 215px; }
		.speaker-top .spring:nth-of-type(2) { width: 190px; height: 190px; }
		.speaker-top .spring:nth-of-type(3) { width: 165px; height: 165px; }
		.speaker-top .spring:nth-of-type(4) { width: 140px; height: 140px; }
		.speaker-top .spring:nth-of-type(5) { width: 115px; height: 115px; }
		.speaker-top .spring:nth-of-type(6) { width: 90px; height: 90px; }
		.speaker-top .spring:nth-of-type(7) { width: 65px; height: 65px; }

		/* Elementos Internos Bocina Inferior */
		.speaker-bottom .inner {
			width: 190px;
			height: 190px;
			border-radius: 100%;
			background: #333;
			box-shadow: 0 0 30px black inset;
			border: 4px solid black;
			display: flex;
			align-items: center;
			justify-content: center;
			position: relative;
		}

		.speaker-bottom .cone {
			width: 80px;
			height: 80px;
			border-radius: 100%;
			background: radial-gradient(circle at 50% 20%, #ffdf73, #d4af37 2%, #8b0000 20%, black 70%);
			z-index: 10;
			animation: bounce .5s infinite;
			box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
		}

		.speaker-bottom .spring {
			position: absolute;
			background: #333;
			box-shadow: 0 0 25px inset black;
			border-radius: 100%;
			animation: spring .5s infinite;
		}

		.speaker-bottom .spring:nth-of-type(1) { width: 170px; height: 170px; }
		.speaker-bottom .spring:nth-of-type(2) { width: 150px; height: 150px; }
		.speaker-bottom .spring:nth-of-type(3) { width: 130px; height: 130px; }
		.speaker-bottom .spring:nth-of-type(4) { width: 110px; height: 110px; }
		.speaker-bottom .spring:nth-of-type(5) { width: 90px; height: 90px; }
		.speaker-bottom .spring:nth-of-type(6) { width: 70px; height: 70px; }
		.speaker-bottom .spring:nth-of-type(7) { width: 50px; height: 50px; }

		@keyframes bounce {
			0% { transform: scale(1); }
			10% { transform: scale(1.3); }
			20% { transform: scale(1.2); }
			100% { transform: scale(1); }
		}

		@keyframes spring {
			0% { transform: scale(1); }
			10% { transform: scale(1.05); }
			100% { transform: scale(1); }
		}

		/* --- ESTILOS DEL CURSOR NEÓN Y RASTRO --- */
		#cursor-punto {
			position: fixed;
			top: 0;
			left: 0;
			width: 8px;
			height: 8px;
			background-color: white;
			border-radius: 50%;
			pointer-events: none;
			z-index: 9999;
			
			box-shadow: 
				0 0 6px rgba(255, 255, 255, 0.9),
				0 0 12px rgba(255, 255, 255, 0.5),
				0 0 20px rgba(255, 215, 0, 0.6);
				
			transition: transform 0.05s ease-out;
			will-change: transform;
		}

		#rastro-contenedor {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
			z-index: 9998;
		}

		.rastro-punto {
			position: absolute;
			width: 6px;
			height: 6px;
			background-color: rgba(255, 215, 0, 0.6);
			border-radius: 50%;
			pointer-events: none;
			box-shadow: 0 0 4px rgba(255, 215, 0, 0.5);
			animation: fadeOut 0.5s forwards ease-out;
		}

		@keyframes fadeOut {
			0% { transform: scale(1); opacity: 0.6; }
			100% { transform: scale(0.1); opacity: 0; }
		}
	</style>
</head>

<body>
	<canvas id="main-canvas"></canvas>
	<div class="neon-overlay"></div>

	<!-- Elemento Chat Backdrop con borde animado en dorado y rojo -->
	<div class="chat-backdrop"></div>

	<!-- Las 4 Bocinas distribuidas en las esquinas como el segundo código -->
	<div class="screen-layout">
		<!-- Bocina Superior Izquierda -->
		<div class="speaker speaker-top" style="grid-column: 1; grid-row: 1;">
			<div class="decoration"></div><div class="decoration"></div>
			<div class="decoration"></div><div class="decoration"></div>
			<div class="inner">
				<div class="spring"></div><div class="spring"></div><div class="spring"></div>
				<div class="spring"></div><div class="spring"></div><div class="spring"></div>
				<div class="spring"></div><div class="cone"></div>
			</div>
		</div>

		<!-- Celda Vacía Central -->
		<div style="grid-column: 2; grid-row: 1 / span 2;"></div>

		<!-- Bocina Superior Derecha -->
		<div class="speaker speaker-top" style="grid-column: 3; grid-row: 1;">
			<div class="decoration"></div><div class="decoration"></div>
			<div class="decoration"></div><div class="decoration"></div>
			<div class="inner">
				<div class="spring"></div><div class="spring"></div><div class="spring"></div>
				<div class="spring"></div><div class="spring"></div><div class="spring"></div>
				<div class="spring"></div><div class="cone"></div>
			</div>
		</div>

		<!-- Bocina Inferior Izquierda -->
		<div class="speaker speaker-bottom" style="grid-column: 1; grid-row: 2;">
			<div class="decoration"></div><div class="decoration"></div>
			<div class="decoration"></div><div class="decoration"></div>
			<div class="inner">
				<div class="spring"></div><div class="spring"></div><div class="spring"></div>
				<div class="spring"></div><div class="spring"></div><div class="spring"></div>
				<div class="spring"></div><div class="cone"></div>
			</div>
		</div>

		<!-- Bocina Inferior Derecha -->
		<div class="speaker speaker-bottom" style="grid-column: 3; grid-row: 2;">
			<div class="decoration"></div><div class="decoration"></div>
			<div class="decoration"></div><div class="decoration"></div>
			<div class="inner">
				<div class="spring"></div><div class="spring"></div><div class="spring"></div>
				<div class="spring"></div><div class="spring"></div><div class="spring"></div>
				<div class="spring"></div><div class="cone"></div>
			</div>
		</div>
	</div>

	<!-- Logo Tabs -->
	<div class="logo-tabs">
		<div class="logo-text">
			<span>L</span><span>E</span><span>G</span><span>I</span><span>O</span><span>N1</span>
		</div>
	</div>

	<!-- Texto con efecto neón de alto impacto -->
	<div class="bottom-text-container">
		<h1 class="neon-title">LEGION RADIO</h1>
	</div>

	<!-- Elementos del cursor personalizado -->
	<div id="cursor-punto"></div>
	<div id="rastro-contenedor"></div>

	<script>
		// --- SCRIPT DEL CURSOR Y RASTRO ---
		const cursorPunto = document.getElementById('cursor-punto');
		const rastroContenedor = document.getElementById('rastro-contenedor');
		
		let cursorX = 0;
		let cursorY = 0;
		let ratonDentro = false;

		document.addEventListener('mousemove', (e) => {
			cursorX = e.clientX;
			cursorY = e.clientY;
			ratonDentro = true;
			
			cursorPunto.style.transform = `translate(${cursorX - 4}px, ${cursorY - 4}px)`;
		});

		document.addEventListener('mouseleave', () => {
			ratonDentro = false;
			cursorPunto.style.opacity = '0';
		});
		
		document.addEventListener('mouseenter', () => {
			ratonDentro = true;
			cursorPunto.style.opacity = '1';
		});

		function gestionarRastro() {
			if (ratonDentro) {
				const rastroPunto = document.createElement('div');
				rastroPunto.classList.add('rastro-punto');
				
				rastroPunto.style.left = `${cursorX - 3}px`;
				rastroPunto.style.top = `${cursorY - 3}px`;
				
				rastroContenedor.appendChild(rastroPunto);
				
				setTimeout(() => {
					rastroPunto.remove();
				}, 500);
			}
			requestAnimationFrame(gestionarRastro);
		}
		gestionarRastro();

		// --- SCRIPT DE LOS HACES DE LUZ / CANVAS ---
		const canvas = document.getElementById('main-canvas');
		const ctx = canvas.getContext('2d');

		function resizeCanvas() {
			canvas.width = window.innerWidth;
			canvas.height = window.innerHeight;
		}
		window.addEventListener('resize', resizeCanvas);
		resizeCanvas();

		class NeonBeam {
			constructor() {
				this.reset();
				this.hue = Math.random() < 0.4 ? (Math.random() < 0.5 ? 45 : 0) : (200 + Math.random() * 160); 
				this.glowColor = `hsla(${this.hue}, 100%, 50%, 0.5)`;
			}
			reset() {
				this.x = Math.random() * canvas.width;
				this.y = -50;
				this.angle = Math.PI / 2 + (Math.random() - 0.5) * 0.8;
				this.life = 0;
				this.maxLife = 1.5 + Math.random() * 2.5;
				this.speed = 1 + Math.random() * 3;
				this.curve = Math.random() * 0.04 - 0.02;
			}
			update(deltaTime) {
				this.life += deltaTime;
				if (this.life > this.maxLife) this.reset();
				this.x += Math.cos(this.angle) * this.speed;
				this.y += Math.sin(this.angle) * this.speed;
				this.angle += this.curve;
			}
			draw() {
				const progress = this.life / this.maxLife;
				const alpha = (1 - progress) * 0.9;
				const beamLength = 350 + Math.sin(progress * Math.PI) * 150;
				
				const gradient = ctx.createLinearGradient(
					this.x, this.y,
					this.x + Math.cos(this.angle) * beamLength,
					this.y + Math.sin(this.angle) * beamLength
				);
				gradient.addColorStop(0, `hsla(${this.hue}, 100%, 85%, ${alpha})`);
				gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
				
				ctx.save();
				ctx.shadowColor = this.glowColor;
				ctx.shadowBlur = 25 + 15 * Math.sin(progress * Math.PI * 2);
				ctx.shadowOffsetX = 2;
				ctx.shadowOffsetY = 2;
				
				ctx.beginPath();
				ctx.moveTo(this.x, this.y);
				ctx.lineTo(
					this.x + Math.cos(this.angle - 0.12) * beamLength,
					this.y + Math.sin(this.angle - 0.12) * beamLength
				);
				ctx.lineTo(
					this.x + Math.cos(this.angle + 0.12) * beamLength,
					this.y + Math.sin(this.angle + 0.12) * beamLength
				);
				ctx.closePath();
				ctx.fillStyle = gradient;
				ctx.fill();
				ctx.restore();
				
				if (Math.random() < 0.25) {
					ctx.beginPath();
					ctx.arc(
						this.x + Math.cos(this.angle) * beamLength * Math.random(),
						this.y + Math.sin(this.angle) * beamLength * Math.random(),
						1.5 + Math.random() * 3.5,
						0, Math.PI * 2
					);
					ctx.fillStyle = `hsla(${this.hue}, 100%, 95%, ${alpha * 0.8})`;
					ctx.fill();
				}
			}
		}

		const beams = Array.from({
			length: 30
		}, () => new NeonBeam());
		let lastTime = 0;

		function animate(timestamp) {
			const deltaTime = (timestamp - lastTime) / 1000;
			lastTime = timestamp;
			
			ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
			ctx.fillRect(0, 0, canvas.width, canvas.height);
			
			beams.forEach(beam => {
				beam.update(deltaTime);
				beam.draw();
			});
			requestAnimationFrame(animate);
		}
		animate(0);
	</script>
</body>

</html>
