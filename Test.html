<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Xatframe Backxatbox - Legion Radio</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
	
	<style>
		:root {
			--decoration-size: 38px;
			--red-pure: #ff0011;
			--red-bright: #ff3300;
			--red-deep: #800000;
			--orange-fire: #ff6600;
		}

		body, html {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: linear-gradient(rgba(10, 0, 0, 0.9), rgba(10, 0, 0, 0.9)), url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8CVGdQaCqOJ0XCETflTj1Cq4AkyZjP1jXzEoXQCW-TLwAinejUr6FTRA&s=10");
			background-size: cover;
			background-repeat: no-repeat;
			background-position: center;
			perspective: 1200px;
		}

		#zone {
			position: absolute;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			pointer-events: none;
			z-index: 3;
		}

		.bubble {
			position: absolute;
			border-radius: 50%;
			pointer-events: none;
			animation: floatUp 3s ease-out forwards;
			mix-blend-mode: screen;
			filter: blur(1px);
		}

		@keyframes floatUp {
			0% {
				transform: translateY(0) scale(0.3);
				opacity: 0;
			}
			15% {
				opacity: 0.6;
			}
			100% {
				transform: translateY(-250px) scale(1.2);
				opacity: 0;
			}
		}

		/* --- CANVAS DE LUCES POR DETRÁS DEL RECUADRO --- */
		#main-canvas {
			display: block;
			position: absolute;
			top: 0;
			left: 0;
			z-index: 9;
			pointer-events: none;
		}

		.neon-overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			pointer-events: none;
			background:
				radial-gradient(circle at 50% 50%,
					rgba(255, 0, 17, 0.15),
					transparent 70%);
			animation: neon-pulse 3s infinite;
			z-index: 2;
		}

		@keyframes neon-pulse {
			0%, 100% {
				opacity: 0.3;
				filter: blur(20px);
			}
			50% {
				opacity: 0.7;
				filter: blur(35px);
			}
		}

		/* --- ESTILO CHAT BACKDROP (Z-INDEX 10) --- */
		.chat-backdrop {
			position: absolute; 
			top: 93px; 
			left: 50.25%; 
			transform: translateX(-50%);
			width: 728px; 
			height: 486px; 
			border-radius: 16px;
			box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 35px rgba(255, 0, 17, 0.35);
			z-index: 10; 
			pointer-events: none; 
			overflow: hidden; 
			background-image: url('https://xatimg.com/image/elY0y7rDXXoR.png');
			background-size: cover; 
			background-position: center; 
			background-repeat: no-repeat;
			opacity: 0.88;
			isolation: isolate;
		}

		.chat-backdrop::before {
			content: '';
			position: absolute;
			top: -50%;
			left: -50%;
			width: 200%;
			height: 200%;
			background: conic-gradient(
				transparent, 
				transparent, 
				rgba(255, 102, 0, 0.85), 
				rgba(255, 0, 17, 0.85),
				transparent
			);
			animation: girarBorde 4s linear infinite;
			z-index: -2;
		}

		.chat-backdrop::after {
			content: '';
			position: absolute;
			inset: 1px;
			border-radius: 15px;
			background: inherit;
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
			z-index: -1;
		}

		@keyframes girarBorde {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}

		/* --- LOGO TABS SUPERIOR CENTRO --- */
		.logo-tabs {
			position: absolute; 
			right: calc(50.25% - 189px + 10px); 
			top: 446px;
			transform: translateY(-50%); 
			z-index: 11; 
			text-align: right;
			background: rgba(15, 0, 0, 0.85); 
			padding: 4px 16px;
			border-radius: 10px 10px 0 0; 
			border: 1px solid rgba(255,0,17,0.2); 
			border-bottom: none;
			isolation: isolate;
		}
		
		.logo-tabs .logo-text {
			font-family: 'Outfit', sans-serif; 
			font-size: 0.8rem; 
			letter-spacing: 2px; 
			font-weight: 700;
			color: #ffffff;
			text-shadow: 0 0 16px rgba(255, 0, 17, 0.6);
			position: relative;
			z-index: 2;
			display: inline-flex; 
		}

		.logo-tabs .logo-text span {
			display: inline-block;
			animation: escribirYBrincarSutil 5s infinite ease-in-out;
		}

		.logo-tabs .logo-text span:nth-child(1) { animation-delay: 0.0s; }
		.logo-tabs .logo-text span:nth-child(2) { animation-delay: 0.1s; }
		.logo-tabs .logo-text span:nth-child(3) { animation-delay: 0.2s; }
		.logo-tabs .logo-text span:nth-child(4) { animation-delay: 0.3s; }

		@keyframes escribirYBrincarSutil {
			0% { opacity: 0; transform: translateY(6px) scale(0.95); }
			10% { opacity: 1; transform: translateY(-2px) scale(1.03); }
			20% { opacity: 1; transform: translateY(0) scale(1); }
			100% { opacity: 1; transform: translateY(0) scale(1); }
		}

		/* --- ESTILO TEXTO INFERIOR --- */
		.bottom-text-container {
			position: absolute;
			bottom: 35px;
			left: 50%;
			transform: translateX(-50%);
			text-align: center;
			z-index: 25;
			pointer-events: none;
			width: 100%;
		}

		.neon-title {
			font-family: 'Montserrat', sans-serif;
			font-size: 110px;
			font-weight: 900;
			font-style: italic;
			text-transform: uppercase;
			margin: 0;
			line-height: 1;
			letter-spacing: 6px;
			color: #ffffff;

			background: linear-gradient(180deg, #ffffff 0%, #ffbb99 35%, #ff0011 60%, #800000 100%);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;

			filter: drop-shadow(0 0 10px #ffffff)
			        drop-shadow(0 0 25px var(--red-pure))
			        drop-shadow(0 0 50px var(--orange-fire))
			        drop-shadow(0 0 90px var(--red-deep));

			animation: neon-flicker-beat 2s infinite alternate;
		}

		@keyframes neon-flicker-beat {
			0%, 100% {
				transform: scale(1);
				filter: drop-shadow(0 0 10px #ffffff)
				        drop-shadow(0 0 25px var(--red-pure))
				        drop-shadow(0 0 50px var(--orange-fire))
				        drop-shadow(0 0 90px var(--red-deep));
			}
			50% {
				transform: scale(1.02);
				filter: drop-shadow(0 0 15px #ffffff)
				        drop-shadow(0 0 35px var(--red-pure))
				        drop-shadow(0 0 65px var(--orange-fire))
				        drop-shadow(0 0 100px var(--red-deep));
			}
			92% { opacity: 1; }
			93% { opacity: 0.85; }
			94% { opacity: 1; }
			96% { opacity: 0.9; }
			98% { opacity: 1; }
		}

		.screen-layout {
			position: absolute;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			display: grid;
			grid-template-columns: 450px 1fr 450px;
			grid-template-rows: 450px 450px;
			gap: 10px;
			max-width: 100%;
			align-items: center;
			justify-items: center;
			z-index: 5;
			pointer-events: none;
		}

		/* --- BOCINAS CLARAS Y NITIDAS (TONO ROJO PURO) --- */
		.speaker {
			border-radius: 100%;
			background: radial-gradient(circle, #330000 0%, #1a0000 70%, #050000 100%);
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			box-shadow: 0 20px 40px rgba(0,0,0,0.9), 0 0 30px rgba(255, 0, 17, 0.35);
			border: 4px solid #b30000;
			pointer-events: auto;
		}

		.speaker-top {
			--speaker-size: 450px;
			width: var(--speaker-size);
			height: var(--speaker-size);
		}

		.speaker-top .decoration:nth-of-type(1) { left: 55px; top: 55px; }
		.speaker-top .decoration:nth-of-type(2) { right: 55px; top: 55px; left: auto; }
		.speaker-top .decoration:nth-of-type(3) { right: 55px; bottom: 55px; left: auto; top: auto; }
		.speaker-top .decoration:nth-of-type(4) { left: 55px; bottom: 55px; top: auto; }

		.decoration {
			position: absolute;
			width: var(--decoration-size);
			height: var(--decoration-size);
			border-radius: 100%;
			background: radial-gradient(#ff0011, #660000);
			border: 2px solid #ff9999;
			box-shadow: 0 0 10px rgba(255,0,17,0.6);
		}

		.speaker-top .inner {
			width: 320px;
			height: 320px;
			border-radius: 100%;
			background: radial-gradient(circle, #240000 0%, #0d0000 100%);
			box-shadow: 0 0 30px rgba(255, 0, 17, 0.3) inset;
			border: 6px solid #1a0000;
			display: flex;
			align-items: center;
			justify-content: center;
			position: relative;
			overflow: visible;
		}

		/* --- ONDAS DE SONIDO NÍTIDAS --- */
		.sound-wave {
			position: absolute;
			border-radius: 100%;
			border: 3px solid rgba(255, 0, 17, 0.9);
			box-shadow: 0 0 20px rgba(255, 0, 17, 0.7), inset 0 0 15px rgba(255, 255, 255, 0.4);
			pointer-events: none;
			animation: expandWave 2s linear infinite;
			z-index: 5;
		}

		.sound-wave:nth-child(1) { animation-delay: 0s; }
		.sound-wave:nth-child(2) { animation-delay: 0.6s; }
		.sound-wave:nth-child(3) { animation-delay: 1.2s; }

		@keyframes expandWave {
			0% {
				width: 140px;
				height: 140px;
				opacity: 1;
				transform: scale(0.8);
			}
			100% {
				width: 380px;
				height: 380px;
				opacity: 0;
				transform: scale(1.3);
				border-color: rgba(255, 0, 17, 0);
				box-shadow: 0 0 25px rgba(255, 0, 17, 0);
			}
		}

		.speaker-top .cone {
			width: 150px;
			height: 150px;
			border-radius: 100%;
			background: radial-gradient(circle at 45% 35%, #ffffff 0%, #ff6633 25%, #ff0011 60%, #330000 90%);
			z-index: 10;
			animation: bounce .5s infinite;
			box-shadow: 0 0 25px rgba(255, 0, 17, 0.8);
			border: 2px solid rgba(255, 255, 255, 0.4);
		}

		.speaker-top .spring {
			position: absolute;
			background: transparent;
			border: 2px solid rgba(255, 0, 17, 0.4);
			box-shadow: 0 0 12px rgba(255, 0, 17, 0.25) inset;
			border-radius: 100%;
			animation: spring .5s infinite;
		}

		.speaker-top .spring:nth-of-type(1) { width: 300px; height: 300px; }
		.speaker-top .spring:nth-of-type(2) { width: 270px; height: 270px; }
		.speaker-top .spring:nth-of-type(3) { width: 240px; height: 240px; }
		.speaker-top .spring:nth-of-type(4) { width: 210px; height: 210px; }
		.speaker-top .spring:nth-of-type(5) { width: 180px; height: 180px; }
		.speaker-top .spring:nth-of-type(6) { width: 150px; height: 150px; }
		.speaker-top .spring:nth-of-type(7) { width: 120px; height: 120px; }

		@keyframes bounce {
			0% { transform: scale(1); }
			10% { transform: scale(1.3); }
			20% { transform: scale(1.2); }
			100% { transform: scale(1); }
		}

		@keyframes spring {
			0% { transform: scale(1); }
			10% { transform: scale(1.05); }
			100% { transform: scale(1); }
		}

		/* --- DISCOS DE VINILO --- */
		.vinyl-container {
			position: absolute;
			top: 70%;
			transform: translateY(-50%);
			width: 480px;
			height: 480px;
			z-index: 6;
			pointer-events: none;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.vinyl-container.left { left: -120px; }
		.vinyl-container.right { right: -120px; }

		.contenedor-disco {
			position: relative;
			width: 100%;
			height: 100%;
			border-radius: 50%;
			overflow: hidden;
			animation: girar 4s linear infinite;
			box-shadow: 0 0 30px rgba(255, 0, 17, 0.45), 0 0 50px rgba(255, 102, 0, 0.3);
			isolation: isolate;
		}

		.contenedor-disco::before {
			content: '';
			position: absolute;
			top: -50%;
			left: -50%;
			width: 200%;
			height: 200%;
			background: conic-gradient(
				transparent, 
				transparent, 
				rgba(255, 0, 17, 0.95), 
				rgba(255, 102, 0, 0.95),
				transparent
			);
			animation: girarBordeDisco 3s linear infinite;
			z-index: -2;
		}

		.contenedor-disco::after {
			content: '';
			position: absolute;
			inset: 3px;
			border-radius: 50%;
			background: rgba(10, 0, 0, 0.9);
			z-index: -1;
		}

		.contenedor-disco img {
			width: 100%;
			height: 100%;
			object-fit: contain;
			filter: drop-shadow(0 15px 30px rgba(0,0,0,0.85));
			position: relative;
			z-index: 1;
		}

		@keyframes girar {
			from { transform: rotate(0deg); }
			to { transform: rotate(360deg); }
		}

		@keyframes girarBordeDisco {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}

		/* --- EFECTO CIRCLE RIPPLE --- */
		.circle-ripple-container {
			position: absolute;
			top: 50%;
			transform: translateY(-50%);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 7;
			pointer-events: none;
		}

		.circle-ripple-container.left { left: -20px; }
		.circle-ripple-container.right { right: -20px; }

		.circle-ripple {
			background-color: #ff0011;
			width: 1em;
			height: 1em;
			font-size: 24px;
			border-radius: 50%;
			animation: ripple 0.7s linear infinite;
		}

		@keyframes ripple {
			0% {
				box-shadow: 0 0 0 0 rgba(255, 0, 17, 0.45),
				            0 0 0 1em rgba(255, 0, 17, 0.45),
				            0 0 0 3em rgba(255, 0, 17, 0.45),
				            0 0 0 5em rgba(255, 0, 17, 0.45);
			}
			100% {
				box-shadow: 0 0 0 1em rgba(255, 0, 17, 0.45),
				            0 0 0 3em rgba(255, 0, 17, 0.45),
				            0 0 0 5em rgba(255, 0, 17, 0.45),
				            0 0 0 8em rgba(255, 0, 17, 0);
			}
		}
	</style>
</head>

<body>
	<div id="zone"></div>
	<canvas id="main-canvas"></canvas>
	<div class="neon-overlay"></div>

	<div class="chat-backdrop"></div>

	<div class="circle-ripple-container left">
		<div class="circle-ripple"></div>
	</div>
	<div class="circle-ripple-container right">
		<div class="circle-ripple"></div>
	</div>

	<div class="vinyl-container left">
		<div class="contenedor-disco">
			<img src="https://xatimg.com/image/mhwBy5Kan5nE.png" alt="Disco girando">
		</div>
	</div>
	<div class="vinyl-container right">
		<div class="contenedor-disco">
			<img src="https://xatimg.com/image/mhwBy5Kan5nE.png" alt="Disco girando">
		</div>
	</div>

	<div class="screen-layout">
		<div class="speaker speaker-top" style="grid-column: 1; grid-row: 1;" id="speaker-tl">
			<div class="decoration"></div><div class="decoration"></div>
			<div class="decoration"></div><div class="decoration"></div>
			<div class="inner">
				<div class="sound-wave"></div>
				<div class="sound-wave"></div>
				<div class="sound-wave"></div>
				<div class="spring"></div><div class="spring"></div><div class="spring"></div>
				<div class="spring"></div><div class="spring"></div><div class="spring"></div>
				<div class="spring"></div><div class="cone"></div>
			</div>
		</div>

		<div style="grid-column: 2; grid-row: 1 / span 2;" id="center-target"></div>

		<div class="speaker speaker-top" style="grid-column: 3; grid-row: 1;" id="speaker-tr">
			<div class="decoration"></div><div class="decoration"></div>
			<div class="decoration"></div><div class="decoration"></div>
			<div class="inner">
				<div class="sound-wave"></div>
				<div class="sound-wave"></div>
				<div class="sound-wave"></div>
				<div class="spring"></div><div class="spring"></div><div class="spring"></div>
				<div class="spring"></div><div class="spring"></div><div class="spring"></div>
				<div class="spring"></div><div class="cone"></div>
			</div>
		</div>
	</div>

	<div class="logo-tabs">
		<div class="logo-text">
			<span>L</span><span>E</span><span>G</span><span>I</span><span>O</span><span>N</span>
		</div>
	</div>

	<div class="bottom-text-container">
		<h1 class="neon-title">LEGION RADIO</h1>
	</div>

	<script>
		const zone = document.getElementById("zone");

		function autoSpawn() {
			const b = document.createElement("div");
			b.className = "bubble";
			const size = Math.random() * 25 + 20;
			b.style.width = b.style.height = `${size}px`;
			b.style.left = `${Math.random() * window.innerWidth}px`;
			b.style.top = `${Math.random() * window.innerHeight}px`;
			b.style.background = `radial-gradient(circle, rgba(255, 0, 17, 0.45) 0%, transparent 100%)`;
			
			zone.appendChild(b);
			setTimeout(() => b.remove(), 3000);
		}

		setInterval(autoSpawn, 30);

		const canvas = document.getElementById('main-canvas');
		const ctx = canvas.getContext('2d');

		function resizeCanvas() {
			canvas.width = window.innerWidth;
			canvas.height = window.innerHeight;
		}
		window.addEventListener('resize', resizeCanvas);
		resizeCanvas();

		class NeonBeam {
			constructor() {
				this.reset();
				this.hue = Math.random() * 360; 
				this.glowColor = `hsla(${this.hue}, 100%, 50%, 0.75)`;
			}
			reset() {
				this.x = Math.random() * canvas.width;
				this.y = -50;
				this.angle = Math.PI / 2 + (Math.random() - 0.5) * 0.8;
				this.life = 0;
				this.maxLife = 1.5 + Math.random() * 2.5;
				this.speed = 1 + Math.random() * 3;
				this.curve = Math.random() * 0.04 - 0.02;
			}
			update(deltaTime) {
				this.life += deltaTime;
				if (this.life > this.maxLife) this.reset();
				this.x += Math.cos(this.angle) * this.speed;
				this.y += Math.sin(this.angle) * this.speed;
				this.angle += this.curve;
			}
			draw() {
				const progress = this.life / this.maxLife;
				const alpha = (1 - progress) * 0.9;
				const beamLength = 350 + Math.sin(progress * Math.PI) * 150;
				
				const gradient = ctx.createLinearGradient(
					this.x, this.y,
					this.x + Math.cos(this.angle) * beamLength,
					this.y + Math.sin(this.angle) * beamLength
				);
				gradient.addColorStop(0, `hsla(${this.hue}, 100%, 85%, ${alpha})`);
				gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
				
				ctx.save();
				ctx.shadowColor = this.glowColor;
				ctx.shadowBlur = 25 + 15 * Math.sin(progress * Math.PI * 2);
				ctx.shadowOffsetX = 2;
				ctx.shadowOffsetY = 2;
				
				ctx.beginPath();
				ctx.moveTo(this.x, this.y);
				ctx.lineTo(
					this.x + Math.cos(this.angle - 0.12) * beamLength,
					this.y + Math.sin(this.angle - 0.12) * beamLength
				);
				ctx.lineTo(
					this.x + Math.cos(this.angle + 0.12) * beamLength,
					this.y + Math.sin(this.angle + 0.12) * beamLength
				);
				ctx.closePath();
				ctx.fillStyle = gradient;
				ctx.fill();
				ctx.restore();
				
				if (Math.random() < 0.25) {
					ctx.beginPath();
					ctx.arc(
						this.x + Math.cos(this.angle) * beamLength * Math.random(),
						this.y + Math.sin(this.angle) * beamLength * Math.random(),
						1.5 + Math.random() * 3.5,
						0, Math.PI * 2
					);
					ctx.fillStyle = `hsla(${this.hue}, 100%, 95%, ${alpha * 0.8})`;
					ctx.fill();
				}
			}
		}

		class MusicNote {
			constructor(startX, startY, targetX, targetY) {
				this.x = startX;
				this.y = startY;
				this.symbol = ['♪', '♫', '♩', '♬'][Math.floor(Math.random() * 4)];
				this.size = 36 + Math.random() * 22;
				this.hue = Math.random() * 360;
				
				const angle = Math.atan2(targetY - startY, targetX - startX) + (Math.random() - 0.5) * 0.2;
				const speed = 1.5 + Math.random() * 1.2;
				this.vx = Math.cos(angle) * speed;
				this.vy = Math.sin(angle) * speed;
				
				this.alpha = 1;
				this.decay = 0.005 + Math.random() * 0.005;
				this.rot = (Math.random() - 0.5) * 0.4;
				this.spin = (Math.random() - 0.5) * 0.02;
			}

			update() {
				this.x += this.vx;
				this.y += this.vy;
				this.rot += this.spin;
				this.alpha -= this.decay;
			}

			draw() {
				if (this.alpha <= 0) return;
				ctx.save();
				ctx.translate(this.x, this.y);
				ctx.rotate(this.rot);
				ctx.font = `900 ${this.size}px 'Kanit', sans-serif`;
				ctx.fillStyle = `hsla(${this.hue}, 100%, 65%, ${this.alpha})`;
				ctx.shadowColor = `hsla(${this.hue}, 100%, 50%, 0.85)`;
				ctx.shadowBlur = 20;
				ctx.fillText(this.symbol, 0, 0);
				ctx.restore();
			}
		}

		const beams = Array.from({ length: 30 }, () => new NeonBeam());
		const notes = [];

		function spawnNotes() {
			const tl = document.getElementById('speaker-tl').getBoundingClientRect();
			const tr = document.getElementById('speaker-tr').getBoundingClientRect();

			const centerX = window.innerWidth / 2;
			const centerY = window.innerHeight / 2;

			notes.push(new MusicNote(tl.left + tl.width / 2, tl.top + tl.height / 2, centerX, centerY));
			notes.push(new MusicNote(tr.left + tr.width / 2, tr.top + tr.height / 2, centerX, centerY));
		}

		setInterval(spawnNotes, 350);

		let lastTime = 0;

		function animate(timestamp) {
			const deltaTime = (timestamp - lastTime) / 1000;
			lastTime = timestamp;
			
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			
			beams.forEach(beam => {
				beam.update(deltaTime);
				beam.draw();
			});

		for (let i = notes.length - 1; i >= 0; i--) {
				notes[i].update();
				notes[i].draw();
				if (notes[i].alpha <= 0) {
					notes.splice(i, 1);
				}
			}

			requestAnimationFrame(animate);
		}
		animate(0);
	</script>
</body>

</html>
