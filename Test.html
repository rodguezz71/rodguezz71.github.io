<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BLue azulito</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
:root {
  --pure-white: #ffffff;
  --white-glow: rgba(255, 255, 255, 0.6);
}

body {
  background: #0b0f1a;
  color: #fff;
  font-family: 'Tajawal', sans-serif;
  display: flex;
  justify-content: center;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding: 40px;
  direction: ltr; 
  overflow-x: hidden;
  position: relative;
  cursor: default;
}

#cursor-lightning-canvas {
  position: fixed;
  inset: 0;
  z-index: 9999;
  pointer-events: none;
  mix-blend-mode: screen;
}

.main-bg-effects {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(circle at center, #0f172a 0%, #070a12 100%);
  overflow: hidden;
}

.laser-grid {
  position: absolute;
  width: 200%;
  height: 200%;
  top: -50%;
  left: -50%;
  background-image: 
    linear-gradient(to right, rgba(52, 152, 219, 0.15) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(26, 188, 156, 0.15) 1px, transparent 1px);
  background-size: 60px 60px;
  transform: perspective(500px) rotateX(60deg);
  animation: gridMove 15s linear infinite;
}

@keyframes gridMove {
  0% { background-position: 0 0; }
  100% { background-position: 0 60px; }
}

.light-beam {
  position: absolute;
  width: 100%;
  height: 4px;
  background: linear-gradient(90deg, transparent, #3498db, #1abc9c, transparent);
  box-shadow: 0 0 20px #3498db, 0 0 40px #1abc9c;
  opacity: 0.7;
  animation: beamSlide 6s ease-in-out infinite;
}

.beam-1 { top: 20%; animation-delay: 0s; }
.beam-2 { top: 75%; animation-delay: 3s; background: linear-gradient(90deg, transparent, #1abc9c, #3498db, transparent); }

@keyframes beamSlide {
  0% { transform: translateX(-100%); opacity: 0; }
  50% { opacity: 0.9; }
  100% { transform: translateX(100%); opacity: 0; }
}

#start-screen {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, #131b2e 0%, #000000 100%);
  z-index: 99999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.8s ease-in-out;
  overflow: hidden;
}

.pulse-ring {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  border: 1px solid rgba(52, 152, 219, 0.3);
  box-shadow: 0 0 30px rgba(52, 152, 219, 0.2);
  animation: pulseWave 4s infinite linear;
  pointer-events: none;
}

.pulse-ring:nth-child(2) { animation-delay: 2s; }

@keyframes pulseWave {
  0% { transform: scale(0.2); opacity: 1; }
  100% { transform: scale(3.5); opacity: 0; }
}

#particles-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.enter-btn {
  position: relative;
  z-index: 10;
  background: linear-gradient(135deg, #1abc9c, #3498db);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.3);
  padding: 16px 40px;
  font-size: 19px;
  font-weight: bold;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 0 25px rgba(52, 152, 219, 0.6);
  transition: all 0.3s ease;
  letter-spacing: 1.5px;
}

.enter-btn:hover { transform: scale(1.08); box-shadow: 0 0 35px rgba(26, 188, 156, 0.9); }

.wrapper {
  display: flex;
  gap: 30px;
  justify-content: center;
  align-items: flex-start; 
  flex-wrap: wrap;
}

.profile-column { display: flex; flex-direction: column; align-items: center; }
.info-column { display: flex; flex-direction: column; justify-content: flex-start; }
.spotify-column { display: flex; flex-direction: column; justify-content: flex-start; }

.profile-pic {
  width: 220px; height: 220px; border-radius: 20px; overflow: hidden;
  border: 3px solid #3498db; box-shadow: 0 0 25px #3498db80; transition: 0.4s;
}
.profile-pic img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; }
.profile-pic:hover img { transform: scale(1.12); }

.name {
  font-size: 26px; font-weight: bold;
  background: linear-gradient(90deg, #1abc9c, #3498db, #1abc9c); 
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-size: 200% 100%; animation: gradient-slide 3s linear infinite;
  margin-bottom: 10px; text-align: center;
}

@keyframes gradient-slide { 0% { background-position: 0% 0%; } 100% { background-position: 200% 0%; } }

.info-box { display: flex; flex-direction: column; gap: 15px; }

.info-row {
  background: linear-gradient(135deg, #ffffff10, #ffffff05);
  border: 1px solid #ffffff30;
  padding: 12px 15px;
  border-radius: 16px;
  width: 260px;
  backdrop-filter: blur(6px);
  transition: 0.3s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.info-row:hover { transform: translateX(6px); background: linear-gradient(135deg, #ffffff20, #ffffff10); }

.info-row .q { font-weight: bold; color: #3498db; font-size: 15px; display: flex; align-items: center; gap: 5px; }

.info-row-special {
  background: linear-gradient(135deg, rgba(26, 188, 156, 0.2), rgba(52, 152, 219, 0.15));
  border: 1px solid rgba(26, 188, 156, 0.6);
  padding: 12px 15px;
  border-radius: 16px;
  width: 260px;
  backdrop-filter: blur(8px);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Estilo para Redes Sociales */
.social-row {
  display: flex;
  justify-content: space-around;
  padding: 15px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 16px;
  width: 260px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  margin-top: 5px;
}

.social-link {
  color: #fff;
  font-size: 20px;
  transition: 0.3s;
}

.social-link:hover { color: #3498db; transform: scale(1.2); }

.neon-effect { color: #fff; font-weight: bold; text-shadow: 0 0 5px #3498db, 0 0 10px #3498db; }
.holo-effect { font-weight: bold; background: linear-gradient(135deg, #a29bfe, #55efc4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.spotify-container {
    width: 260px; height: 352px; border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(29, 185, 84, 0.5); background: #121212;
}

.spotify-container iframe { width: 100%; height: 100%; border: none; display: block; }

.quote-box {
  background: rgba(52, 152, 219, 0.1); border: 1px solid #3498db80;
  border-radius: 12px; padding: 15px 20px; width: 100%; max-width: 600px;
  margin-top: 30px; backdrop-filter: blur(6px); text-align: center;
}

.firma-creador {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    font-size: 13px; letter-spacing: 2px; z-index: 50; pointer-events: none;
    animation: colorFirma 4s infinite alternate;
}

@keyframes colorFirma { 0% { color: #555; } 100% { color: #fff; } }

@media (max-width: 900px) {
  .wrapper { flex-direction: column; align-items: center; gap: 20px; }
}
</style>
</head>
<body>

<canvas id="cursor-lightning-canvas"></canvas>

<div class="main-bg-effects">
  <div class="laser-grid"></div>
  <div class="light-beam beam-1"></div>
  <div class="light-beam beam-2"></div>
</div>

<div id="start-screen">
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <canvas id="particles-canvas"></canvas>
    <button class="enter-btn" onclick="enterSite()">ENTRAR</button>
</div>

<div class="wrapper">
  <div class="profile-column">
    <div class="profile-pic">
      <img src="https://gifsec.com/wp-content/uploads/2022/11/dark-anime-gif-16.gif" alt="perfil">
    </div>
    <div class="name">彡[𝐴𝒍𝒆𝑅𝒊𝒐𝑡]彡</div>
  </div>

  <div class="info-column">
    <div class="info-box">
      <div class="info-row-special">
        <div class="neon-effect">ALeRiot3991</div>
        <div class="holo-effect">(1559749330).</div>
      </div>
      <div class="info-row">
        <div class="q"><i class="fas fa-map-marker-alt"></i> País:</div>
        <div>Mexico <img src="https://xat.com/images/smw/flag/mx.png" style="height: 14px;" alt="MX"></div>
      </div>
      <div class="info-row">
        <div class="q"><i class="fas fa-fire"></i> Signo:</div>
        <div>Aries ♈</div>
      </div>
      <div class="info-row">
        <div class="q"><i class="fas fa-signal"></i> Estado:</div>
        <div><span id="status-indicator" style="width: 8px; height: 8px; background-color: #2ecc71; border-radius: 50%; display: inline-block;"></span> <span id="status-text">Verificando...</span></div>
      </div>
      
      <!-- Sección de Redes Sociales -->
      <div class="social-row">
        <a href="https://instagram.com/ale.riot.27" target="_blank" class="social-link"><i class="fab fa-instagram"></i></a>
        <a href="https://youtube.com/@aleriiot" target="_blank" class="social-link"><i class="fab fa-youtube"></i></a>
        <a href="https://tiktok.com/@ale.riot5" target="_blank" class="social-link"><i class="fab fa-tiktok"></i></a>
      </div>
    </div>
  </div>

  <div class="spotify-column">
    <div class="spotify-container" id="spotify-wrapper"></div>
  </div>
</div>

<div class="quote-box">
  <p>El único modo de hacer un gran trabajo es amar lo que haces.</p>
</div>

<div class="firma-creador">Desings: ☬ TemerX™</div>

<script>
  // Canvas de Rayos
  const cursorCanvas = document.getElementById('cursor-lightning-canvas');
  const cursorCtx = cursorCanvas.getContext('2d');
  function resizeCursorCanvas() { cursorCanvas.width = window.innerWidth; cursorCanvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCursorCanvas);
  resizeCursorCanvas();

  // Partículas y Status
  async function fetchOnlineStatus() {
      try {
          const response = await fetch('https://illuxat.com/api/online/AleRiot3991');
          const data = await response.text();
          document.getElementById('status-text').innerText = data.includes("Online") ? "EN LÍNEA" : "AUSENTE";
      } catch(e) {}
  }
  fetchOnlineStatus(); setInterval(fetchOnlineStatus, 30000);

  function enterSite() {
      const startScreen = document.getElementById('start-screen');
      startScreen.style.opacity = '0';
      
      setTimeout(() => { 
          startScreen.style.display = 'none'; 
          document.body.style.overflow = 'auto'; 
          
          // Carga optimizada del reproductor de Spotify tras la interacción del usuario
          const spotifyWrapper = document.getElementById('spotify-wrapper');
          spotifyWrapper.innerHTML = `
            <iframe 
                src="https://open.spotify.com/embed/playlist/5IH8zTAcwg1OZoGgYba9ML?utm_source=generator&theme=0&autoplay=1" 
                width="100%" 
                height="100%" 
                style="border:none;" 
                frameborder="0" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                loading="eager">
            </iframe>
          `;
      }, 800);
  }
</script>

</body>
</html>
