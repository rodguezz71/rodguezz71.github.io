<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinki XatSpace PRO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Oswald:wght@500;700&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --azul-pumas: #002D62; 
            --azul-brillo: #00d2ff;
            --oro: #C5B078;
            --bg-cristal: rgba(10, 15, 25, 0.85);
            --borde-cristal: rgba(0, 210, 255, 0.2);
            --pure-white: #ffffff;
            --white-glow: rgba(255, 255, 255, 0.6);
        }

        body {
            margin: 0;
            padding: 10px;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            /* Degradado oscuro de abajo hacia arriba combinado con la imagen de fondo */
            background: linear-gradient(to top, rgba(2, 4, 8, 0.95) 0%, rgba(5, 10, 20, 0.7) 50%, rgba(10, 15, 25, 0.4) 100%), 
                        url('https://i.pinimg.com/1200x/e5/02/53/e5025381bcba06490647cf356bc5db05.jpg') center/cover no-repeat fixed;
            color: #fff;
            box-sizing: border-box;
            overflow: hidden;
            cursor: none;
        }

        /* --- CONTENEDOR DE PARTÍCULAS DE FONDO --- */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: var(--azul-brillo);
            border-radius: 50%;
            animation: floatParticle linear infinite;
            opacity: 0;
            box-shadow: 0 0 6px var(--azul-brillo);
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(105vh) scale(0);
                opacity: 0;
            }
            20% {
                opacity: 0.9;
            }
            80% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* --- CURSOR BRILLANTE PERSONALIZADO --- */
        .cursor-glow {
            position: fixed;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.8) 0%, rgba(0, 210, 255, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 999999;
            transition: width 0.2s ease, height 0.2s ease, background 0.2s ease;
            mix-blend-mode: screen;
        }

        .cursor-dot {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1000000;
            box-shadow: 0 0 10px #fff;
        }

        /* --- PANTALLA DE INICIO (INTRO) --- */
        #pantalla-intro {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: all 0.5s ease;
        }

        .intro-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: inherit; filter: grayscale(100%) blur(5px);
            z-index: -1; transition: opacity 2s ease;
        }
        
        .intro-bg-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); z-index: -1; transition: opacity 2s ease;
        }

        .intro-contenido { text-align: center; transition: opacity 0.5s ease, transform 0.5s ease; }

        .intro-titulo {
            font-family: 'Oswald', sans-serif; font-size: 5rem; color: #fff; margin: 0;
            text-transform: uppercase; letter-spacing: 5px;
            text-shadow: 0 0 30px var(--azul-brillo); animation: latido 2s infinite alternate;
        }

        .intro-sub {
            font-size: 14px; color: var(--oro); margin-top: 10px; letter-spacing: 2px;
            animation: parpadeo 1.5s infinite;
        }

        @keyframes latido {
            0% { transform: scale(1); text-shadow: 0 0 20px var(--azul-brillo); }
            100% { transform: scale(1.05); text-shadow: 0 0 50px var(--azul-brillo), 0 0 10px #fff; }
        }
        @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* --- CONTENEDOR PRINCIPAL CON UNA SOLA LÍNEA NEÓN GIRATORIA --- */
        .card-wrapper {
            position: relative;
            width: 95vw; 
            max-width: 360px; 
            height: 90vh; 
            max-height: 650px;
            border-radius: 26px;
            opacity: 0;
            transform: scale(0.9);
            transition: all 1.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            visibility: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            overflow: hidden;
            z-index: 2;
        }

        .card-wrapper.visible {
            opacity: 1;
            transform: scale(1);
            visibility: visible;
            animation: flotar 6s ease-in-out infinite 1s; 
        }

        .card-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            right: -50%;
            bottom: -50%;
            background: conic-gradient(from 0deg, transparent 70%, transparent 90%, #39ff14 98%, #ffffff 100%);
            animation: girarUnaLinea 4s linear infinite;
            z-index: 1;
        }

        @keyframes girarUnaLinea {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .card {
            position: absolute;
            inset: 2px;
            background: var(--bg-cristal); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            border-radius: 24px; 
            border: 1px solid var(--borde-cristal);
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            z-index: 2;
        }

        /* --- PORTADA --- */
        .portada {
            height: 140px; min-height: 140px;
            background: url('https://mrwallpaper.com/images/hd/powerful-sesshomaru-in-midst-of-battle-57xxs3lcy4iuhhxm.jpg') center/cover; position: relative;
        }
        .portada::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 70%;
            background: linear-gradient(to top, rgba(10,15,25,0.9), transparent);
        }

        /* --- AVATAR Y HEADER --- */
        .perfil-header { display: flex; flex-direction: column; align-items: center; margin-top: -60px; position: relative; z-index: 2; }
        
        .avatar {
            width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
            border: 3px solid rgba(10, 15, 25, 0.9); box-shadow: 0 0 20px var(--azul-brillo);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .avatar:hover { transform: scale(1.1) rotate(5deg); box-shadow: 0 0 40px var(--azul-brillo); border-color: var(--azul-brillo); }

        .nombre {
            font-family: 'Oswald', sans-serif; font-size: 26px; margin: 10px 0 2px; color: #fff;
            text-transform: uppercase; text-shadow: 0 0 15px var(--azul-brillo); letter-spacing: 1px;
        }

        .id-codigo {
            font-family: 'Space Mono', monospace; font-size: 11px; color: var(--oro);
            background: rgba(0, 0, 0, 0.6); padding: 4px 15px; border-radius: 20px;
            border: 1px solid rgba(197, 176, 120, 0.4); margin-bottom: 5px; letter-spacing: 3px;
            box-shadow: 0 0 10px rgba(197, 176, 120, 0.2);
        }

        /* --- NAVEGACIÓN Y ESTADO --- */
        .nav-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(0, 210, 255, 0.15);
            background: rgba(0, 0, 0, 0.2);
        }

        .nav { 
            display: flex; 
            justify-content: center; 
            gap: 15px; 
            position: relative;
        }

        .nav-indicator {
            position: absolute;
            bottom: -10px;
            left: 0;
            height: 3px;
            background: var(--azul-brillo);
            box-shadow: 0 0 10px var(--azul-brillo);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0px;
            transform: translateX(0);
        }

        .nav-btn {
            background: none; border: none; color: rgba(255, 255, 255, 0.4); font-size: 22px; transition: 0.3s; position: relative; padding: 5px 10px;
        }
        .nav-btn.activo { color: var(--azul-brillo); transform: translateY(-2px); }

        /* --- RECUADRO TRANSPARENTE DE ESTADO --- */
        .status-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.03);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-label {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
        }

        /* --- CONTENIDO INTERNO --- */
        .contenido {
            flex: 1; overflow-y: auto; padding: 20px; position: relative;
            -ms-overflow-style: none; scrollbar-width: none;
        }
        .contenido::-webkit-scrollbar { display: none; }
        .tab { display: none; opacity: 0; }
        .tab.activa { display: block; animation: zoomFade 0.4s forwards; }

        @keyframes zoomFade { 0% { opacity: 0; transform: scale(0.95) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

        /* --- SECCIONES --- */
        .bio { font-size: 13px; color: #b0c4de; text-align: center; line-height: 1.6; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);}
        
        .datos {
            display: flex; justify-content: space-around; background: rgba(0, 0, 0, 0.4); border-radius: 15px;
            padding: 15px 0; border: 1px solid rgba(0, 210, 255, 0.15); box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }
        .dato-item { text-align: center; }
        .dato-num { font-family: 'Oswald'; font-size: 20px; color: var(--azul-brillo); display: block; text-shadow: 0 0 10px var(--azul-brillo);}
        .dato-text { font-size: 9px; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 1px;}

        /* --- AMIGOS --- */
        .amigo-item {
            display:flex; gap:15px; margin-bottom:15px; background: rgba(0, 210, 255, 0.05); padding:10px; 
            border-radius:15px; align-items:center; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s;
        }
        .amigo-item:hover {
            border-color: var(--azul-brillo); background: rgba(0, 210, 255, 0.1);
            transform: translateX(5px); box-shadow: 0 5px 15px rgba(0, 210, 255, 0.2);
        }

        /* --- REPRODUCTOR BLANCO ESTILIZADO --- */
        .audio-controls {
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 20px; 
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
            margin-top: 25px;
        }

        .audio-controls i {
            cursor: pointer; 
            color: var(--pure-white); 
            font-size: 1.2rem; 
            text-shadow: 0 0 10px var(--white-glow);
            transition: 0.3s;
        }

        .audio-controls i:hover {
            text-shadow: 0 0 15px var(--pure-white);
            transform: scale(1.1);
        }

        input[type=range] { 
            -webkit-appearance: none; 
            width: 80px; 
            background: transparent; 
        }
        input[type=range]::-webkit-slider-runnable-track { 
            width: 100%; 
            height: 3px; 
            background: rgba(255, 255, 255, 0.3); 
            border-radius: 5px;
        }
        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            height: 12px; 
            width: 12px; 
            border-radius: 50%; 
            background: var(--pure-white); 
            cursor: pointer; 
            margin-top: -4.5px; 
            box-shadow: 0 0 10px var(--pure-white); 
        }

        /* --- FIRMA DEL CREADOR --- */
        .firma-creador {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            z-index: 50; 
            pointer-events: none; 
            animation: colorFirma 4s infinite alternate ease-in-out;
        }

        @keyframes colorFirma {
            0% { color: #555555; opacity: 0.3; text-shadow: 0 0 2px rgba(85,85,85,0.2); } 
            50% { color: #e0e0e0; opacity: 0.7; text-shadow: 0 0 8px rgba(224,224,224,0.6); } 
            100% { color: #999999; opacity: 0.4; text-shadow: 0 0 4px rgba(153,153,153,0.3); } 
        }

    </style>
</head>
<body>

    <!-- Etiqueta de Audio -->
    <audio id="bgMusic" loop>
        <source src="https://www.image2url.com/r2/default/audio/1785836182504-f69e9afd-33a5-4e5a-b9f5-60a91f36bda2.mp3" type="audio/mpeg">
    </audio>

    <script>
        /* --- GENERADOR DE PARTÍCULAS --- */
        function crearParticulas() {
            const container = document.getElementById('particlesContainer');
            const cantidad = 90; // Cantidad incrementada de partículas

            for (let i = 0; i < cantidad; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Posición y tamaño aleatorio
                const size = Math.random() * 3.5 + 1; // entre 1px y 4.5px
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}vw`;
                
                // Duración y retraso aleatorio para el movimiento fluido
                const duration = Math.random() * 6 + 3; // entre 3s y 9s
                const delay = Math.random() * 5;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;

                container.appendChild(particle);
            }
        }
        crearParticulas();

        /* --- LÓGICA DEL CURSOR MÁGICO --- */
        const cursorGlow = document.getElementById('cursor-glow');
        const cursorDot = document.getElementById('cursor-dot');

        document.addEventListener('mousemove', (e) => {
            cursorGlow.style.left = e.clientX + 'px';
            cursorGlow.style.top = e.clientY + 'px';
            cursorDot.style.left = e.clientX + 'px';
            cursorDot.style.top = e.clientY + 'px';
        });

        document.querySelectorAll('.clikable, #pantalla-intro, .avatar').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursorGlow.style.width = '60px';
                cursorGlow.style.height = '60px';
                cursorGlow.style.background = 'radial-gradient(circle, rgba(0, 210, 255, 0.9) 0%, rgba(0, 210, 255, 0) 70%)';
            });
            el.addEventListener('mouseleave', () => {
                cursorGlow.style.width = '30px';
                cursorGlow.style.height = '30px';
                cursorGlow.style.background = 'radial-gradient(circle, rgba(0, 210, 255, 0.8) 0%, rgba(0, 210, 255, 0) 70%)';
            });
        });

        /* --- REPRODUCTOR DE MÚSICA --- */
        const music = document.getElementById('bgMusic');
        const muteBtn = document.getElementById('muteBtn');
        const playBtn = document.getElementById('playBtn');

        music.volume = 0.5;

        function togglePlay() {
            if (music.paused) {
                music.play().then(() => {
                    playBtn.className = "fas fa-pause clikable";
                }).catch(e => console.log("Reproducción bloqueada por navegador"));
            } else {
                music.pause();
                playBtn.className = "fas fa-play clikable";
            }
        }

        function toggleMute() {
            if (music.muted) { 
                music.muted = false; 
                muteBtn.className = "fas fa-volume-up clikable"; 
            } else { 
                music.muted = true; 
                muteBtn.className = "fas fa-volume-mute clikable"; 
            }
        }

        function changeVolume(val) {
            music.volume = val;
            muteBtn.className = val == 0 ? "fas fa-volume-mute clikable" : "fas fa-volume-up clikable";
            if(val > 0) music.muted = false;
        }

        /* --- FETCH ONLINE STATUS --- */
        async function fetchOnlineStatus() {
            try {
                const response = await fetch('https://illuxat.com/api/online/RaphaeLDRZM');
                const text = await response.text();
                const statusText = document.getElementById('status-text');
                const statusIndicator = document.getElementById('status-indicator');
                
                let isOnline = false;
                
                try {
                    const data = JSON.parse(text);
                    if (data && data.data && data.data.status === "Online") {
                        isOnline = true;
                    } else if (data && data.status === "Online") {
                        isOnline = true;
                    } else if (data === "Online") {
                        isOnline = true;
                    }
                } catch (e) {
                    const cleanText = text.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();
                    if (cleanText === "online" || cleanText === "1" || cleanText === "true") {
                        isOnline = true;
                    }
                }
                
                if (isOnline) {
                    statusText.innerText = "EN LÍNEA";
                    statusIndicator.className = "status-dot bg-green-500 animate-pulse";
                    statusIndicator.style.backgroundColor = "#22c55e";
                    statusIndicator.style.boxShadow = "0 0 8px #22c55e";
                } else {
                    statusText.innerText = "AUSENTE";
                    statusIndicator.className = "status-dot bg-orange-500 animate-pulse";
                    statusIndicator.style.backgroundColor = "#f97316";
                    statusIndicator.style.boxShadow = "0 0 8px #f97316";
                }
            } catch (error) {
                console.error("Error fetching online status:", error);
                const statusText = document.getElementById('status-text');
                const statusIndicator = document.getElementById('status-indicator');
                statusText.innerText = "AUSENTE";
                statusIndicator.style.backgroundColor = "#f97316";
            }
        }
        
        fetchOnlineStatus();

        /* --- LÓGICA DEL ENTORNO --- */
        const intro = document.getElementById('pantalla-intro');
        const introTexto = document.getElementById('intro-texto');
        const introBg = document.getElementById('intro-bg');
        const introOverlay = document.getElementById('intro-overlay');
        const tarjeta = document.getElementById('tarjeta-principal');

        function entrarAlPerfil() {
            music.play().then(() => {
                playBtn.className = "fas fa-pause clikable";
            }).catch(e => console.log("Reproducción bloqueada por navegador"));

            introTexto.style.opacity = '0';
            introTexto.style.transform = 'scale(0.8)';
            introBg.style.filter = 'grayscale(0%) blur(0px)';
            introOverlay.style.opacity = '0.3'; 
            intro.style.pointerEvents = 'none';

            setTimeout(() => {
                intro.style.opacity = '0'; 
                setTimeout(() => {
                    intro.style.display = 'none'; 
                    tarjeta.classList.add('visible'); 
                    actualizarIndicador(document.querySelector('.nav-btn.activo'));
                }, 1000); 
            }, 1500); 
        }

        function actualizarIndicador(elemento) {
            const indicador = document.getElementById('nav-indicator');
            const navContainer = document.getElementById('nav-container');
            
            const btnRect = elemento.getBoundingClientRect();
            const navRect = navContainer.getBoundingClientRect();
            
            const leftPos = btnRect.left - navRect.left;
            const width = btnRect.width;

            indicador.style.width = width + 'px';
            indicador.style.transform = `translateX(${leftPos}px)`;
        }

        function abrirTab(tabId, elemento) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('activa'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('activa'));
            document.getElementById(tabId).classList.add('activa');
            elemento.classList.add('activa');
            
            actualizarIndicador(elemento);
        }

        window.addEventListener('resize', () => {
            const btnActivo = document.querySelector('.nav-btn.activo');
            if (btnActivo) {
                actualizarIndicador(btnActivo);
            }
        });
    </script>
</body>
</html>
